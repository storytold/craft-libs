name: Atomic file writes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/atomic/**', 'crates/settings/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/atomic.yml']
  pull_request:
    paths: ['crates/atomic/**', 'crates/settings/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/atomic.yml']

permissions:
  contents: read

concurrency:
  # One group per pull request and per branch: a newer push cancels the run it supersedes, on main
  # too, since the newest run checks everything before it.
  group: atomic-${{ github.ref }}
  cancel-in-progress: true

# fmt, clippy and the tests run in the Workspace gate on every OS; this runs what it does not.
jobs:
  atomic:
    name: Atomic inherited Linux ACLs
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
      - uses: step-security/dtolnay-rust-toolchain@v1.0.0
        with:
          toolchain: stable
      - name: Install ACL tools
        run: sudo apt-get update && sudo apt-get install -y acl
      - name: Check inherited Linux ACLs
        run: cargo test -p craft-atomic --locked -- --ignored --nocapture

  wasm:
    name: Atomic WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check -p craft-atomic --target wasm32-unknown-unknown

