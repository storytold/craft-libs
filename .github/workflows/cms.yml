name: Colour management

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/cms/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/cms.yml']
  pull_request:
    paths: ['crates/cms/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/cms.yml']

permissions:
  contents: read

concurrency:
  # One group per pull request and per branch: a newer push cancels the run it supersedes, on main
  # too, since the newest run checks everything before it.
  group: cms-${{ github.ref }}
  cancel-in-progress: true

# clippy and the debug tests run in the Workspace gate; this runs the release build of the tests.
jobs:
  cms:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      # Release: the FOGRA39 fit and ink-limit tests take about 35 s in debug and 4 s here. Tests that need
      # installed system profiles print "skipped:" when none are present.
      - run: cargo test -p craft-cms --all-features --release --locked -- --nocapture
