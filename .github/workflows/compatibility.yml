# Cross-application compatibility validation: tests candidate craft-libs revisions
# against downstream application test suites (PhotoCraft, VectorCraft) using ephemeral
# git worktrees, verifying that shared library changes do not regress consumers before
# dependency pins are bumped.
name: Compatibility

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'xtask/**'
      - '.github/workflows/compatibility.yml'
  workflow_dispatch:
    inputs:
      consumers:
        description: 'Consumers to validate (comma-separated)'
        required: false
        default: 'photocraft,vectorcraft'
      skip_baseline:
        description: 'Skip baseline check (test candidate only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  validate:
    name: cross-application compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout craft-libs
        uses: actions/checkout@v4
        with:
          path: craft-libs
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout PhotoCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/photocraft
          path: photocraft
          fetch-depth: 1

      - name: Checkout VectorCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/vectorcraft
          path: vectorcraft
          fetch-depth: 1

      - name: Install Linux system dependencies (egui/winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: craft-libs -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Shared library quality gates
        working-directory: craft-libs
        run: cargo xtask ci

      - name: Run compatibility validation
        working-directory: craft-libs
        run: |
          REVISION="${{ github.event.pull_request.head.sha || github.sha }}"
          cargo xtask compat \
            --revision "$REVISION" \
            --consumers ${{ inputs.consumers || 'photocraft,vectorcraft' }} \
            --consumers-dir .. \
            --quick

      - name: Upload compatibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-report
          path: |
            craft-libs/target/compat/report.json
            craft-libs/target/compat/logs/
          if-no-files-found: ignore
