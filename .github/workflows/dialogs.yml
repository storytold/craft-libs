name: Dialogs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/dialogs/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/dialogs.yml']
  pull_request:
    paths: ['crates/dialogs/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/dialogs.yml']

permissions:
  contents: read

concurrency:
  # Pull requests share one group per branch, so a newer push cancels the older run. Every other
  # run (main, manual) gets a group of its own, so it is neither cancelled nor replaced while queued.
  group: dialogs-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dialogs:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          # The token isn't needed after checkout; cargo runs build scripts and proc macros from
          # dependencies, so don't leave it in .git/config for that third-party code to read.
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
          components: clippy
          # The macOS code is linted on Linux: it compiles for the target without the SDK.
          targets: aarch64-apple-darwin
      - run: cargo clippy -p craft-dialogs --all-targets --locked -- -D warnings
      - run: cargo clippy -p craft-dialogs --target aarch64-apple-darwin --locked -- -D warnings
      - run: cargo test -p craft-dialogs --locked
