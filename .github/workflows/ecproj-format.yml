name: EffectCraft project format

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/ecproj-format/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/ecproj-format.yml']
  pull_request:
    paths: ['crates/ecproj-format/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/ecproj-format.yml']

permissions:
  contents: read

concurrency:
  # Pull requests share one group per branch, so a newer push cancels the older run. Every other
  # run (main, manual) gets a group of its own, so it is neither cancelled nor replaced while queued.
  group: ecproj-format-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# fmt, clippy and the tests run in the Workspace gate on every OS; this checks what it does not.
jobs:
  ecproj-format:
    name: EffectCraft project format WASM
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@v1.0.0
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo check -p craft-ecproj-format --locked --target wasm32-unknown-unknown
