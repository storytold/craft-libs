name: Shared installer

on:
  push:
    branches: [main]
    paths: ["crates/installer/**", "Cargo.toml", "Cargo.lock", ".github/workflows/installer.yml"]
  pull_request:
    paths: ["crates/installer/**", "Cargo.toml", "Cargo.lock", ".github/workflows/installer.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Installer (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: craft-installer
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p craft-installer --all-targets --locked -- -D warnings
      - run: cargo test -p craft-installer --locked
