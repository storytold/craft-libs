name: Shared JPEG

on:
  push:
    branches: [main]
    paths: ["crates/jpeg/**", "Cargo.toml", "Cargo.lock", ".github/workflows/jpeg.yml"]
  pull_request:
    paths: ["crates/jpeg/**", "Cargo.toml", "Cargo.lock", ".github/workflows/jpeg.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests share one group per branch, so a newer push cancels the older run. Every other
  # run (main, manual) gets its own group: it is never cancelled or replaced while queued, so it
  # always gets to save the cache.
  group: shared-jpeg-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    timeout-minutes: 10
    # fmt, clippy and the tests run in the Workspace gate on every OS.
    name: JPEG WASM
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@v1.0.0
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo check -p craft-jpeg --locked --target wasm32-unknown-unknown
