name: Shared JPEG

on:
  push:
    branches: [main, next]
    paths: ["crates/jpeg/**", "Cargo.toml", "Cargo.lock", ".github/workflows/jpeg.yml"]
  pull_request:
    paths: ["crates/jpeg/**", "Cargo.toml", "Cargo.lock", ".github/workflows/jpeg.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per pull request and per branch: a newer push cancels the run it supersedes, on main
  # too, since the newest run checks everything before it.
  group: shared-jpeg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Uncached: the wasm check builds its dependencies on every run (about 10 minutes with setup).
    timeout-minutes: 20
    # fmt, clippy and the tests run in the Workspace gate on every OS.
    name: JPEG WASM
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@v1.0.0
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo check -p craft-jpeg --locked --target wasm32-unknown-unknown
