name: Shared JPEG

on:
  push:
    branches: [main]
    paths: ["crates/jpeg/**", "Cargo.toml", "Cargo.lock", ".github/workflows/jpeg.yml"]
  pull_request:
    paths: ["crates/jpeg/**", "Cargo.toml", "Cargo.lock", ".github/workflows/jpeg.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests share one group per branch, so a newer push cancels the older run. Every other
  # run (main, manual) gets its own group: it is never cancelled or replaced while queued, so it
  # always gets to save the cache.
  group: shared-jpeg-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    timeout-minutes: 10
    name: JPEG lint, tests, WASM
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: step-security/rust-cache@8871c8ba063416da7c32246932ea6ae08700453e # v2.9.2
        with:
          key: craft-jpeg
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt -p craft-jpeg --check
      - run: cargo clippy -p craft-jpeg --all-targets --locked -- -D warnings
      - run: cargo test -p craft-jpeg --locked
      - run: cargo check -p craft-jpeg --locked --target wasm32-unknown-unknown
