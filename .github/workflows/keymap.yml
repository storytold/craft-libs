name: Keymap

on:
  push:
    branches: [main]
    paths: ["crates/keymap/**", "crates/settings/**", "crates/ui/**", "crates/i18n/**", "Cargo.toml", "Cargo.lock", ".github/workflows/keymap.yml"]
  pull_request:
    paths: ["crates/keymap/**", "crates/settings/**", "crates/ui/**", "crates/i18n/**", "Cargo.toml", "Cargo.lock", ".github/workflows/keymap.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests share one group per branch, so a newer push cancels the older run. Every other
  # run (main, manual) gets its own group: it is never cancelled or replaced while queued, so it
  # always gets to save the cache.
  group: keymap-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    timeout-minutes: 15
    name: Keymap (Linux)
    runs-on: ubuntu-latest
    env:
      CRAFT_FONTS_DIR: ${{ github.workspace }}/.test-inputs/craft-fonts
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout test fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: .test-inputs/craft-fonts
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: step-security/rust-cache@8871c8ba063416da7c32246932ea6ae08700453e # v2.9.2
        with:
          key: craft-keymap-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt -p craft-keymap --check
      - run: cargo clippy -p craft-keymap --all-targets --no-default-features --locked -- -D warnings
      # `snapshot` covers `ui` and `egui` and compiles the dialog screenshots, which need a GPU
      # to run, so the test steps leave them out.
      - run: cargo clippy -p craft-keymap --all-targets --features snapshot --locked -- -D warnings
      # Doctests run once, in the `ui` step.
      - name: Test core
        run: cargo test -p craft-keymap --no-default-features --lib --tests --locked
      - name: Test egui dispatch and the shortcuts dialog
        run: cargo test -p craft-keymap --features ui --locked
  native:
    timeout-minutes: 15
    name: Keymap (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are kept for releases: macOS runs only when started by hand.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["macos-latest","windows-latest"]') || fromJSON('["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      CRAFT_FONTS_DIR: ${{ github.workspace }}/.test-inputs/craft-fonts
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout test fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: .test-inputs/craft-fonts
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
      - uses: step-security/rust-cache@8871c8ba063416da7c32246932ea6ae08700453e # v2.9.2
        with:
          key: craft-keymap-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p craft-keymap --features ui --locked
  wasm:
    timeout-minutes: 10
    name: Keymap WASM
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: step-security/rust-cache@8871c8ba063416da7c32246932ea6ae08700453e # v2.9.2
        with:
          key: craft-keymap-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check -p craft-keymap --features ui --locked --target wasm32-unknown-unknown
