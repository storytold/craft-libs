name: Shared media

on:
  push:
    branches: [main]
    paths: ["crates/media/**", "crates/media-testkit/**", "Cargo.toml", "Cargo.lock", ".github/workflows/media.yml"]
  pull_request:
    paths: ["crates/media/**", "crates/media-testkit/**", "Cargo.toml", "Cargo.lock", ".github/workflows/media.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests share one group per branch, so a newer push cancels the older run. Every other
  # run (main, manual) gets its own group: it is never cancelled or replaced while queued, so it
  # always gets to save the cache.
  group: shared-media-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    timeout-minutes: 10
    name: Media lint, feature sets, WASM
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: step-security/rust-cache@8871c8ba063416da7c32246932ea6ae08700453e # v2.9.2
        with:
          key: craft-media-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt -p craft-media --check
      - run: cargo clippy -p craft-media --all-targets --locked --no-default-features -- -D warnings
      - run: cargo clippy -p craft-media --all-targets --locked --no-default-features --features bitstream -- -D warnings
      - run: cargo clippy -p craft-media --all-targets --locked -- -D warnings
      - run: cargo clippy -p craft-media --all-targets --locked --no-default-features --features matroska -- -D warnings
      - run: cargo clippy -p craft-media --all-targets --locked --no-default-features --features ogg -- -D warnings
      - run: cargo clippy -p craft-media --all-targets --locked --all-features -- -D warnings
      - run: cargo clippy -p craft-media-testkit --all-targets --locked -- -D warnings
      - run: cargo clippy -p craft-media --all-targets --locked --no-default-features --features serde -- -D warnings
      - run: cargo check -p craft-media --all-features --locked --target wasm32-unknown-unknown
  test:
    timeout-minutes: 15
    name: Media tests with ffmpeg oracles
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
      - uses: step-security/rust-cache@8871c8ba063416da7c32246932ea6ae08700453e # v2.9.2
        with:
          key: craft-media-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build tests while installing ffmpeg
        run: |
          # The man-db index rebuild after dpkg is slow on hosted runners.
          sudo rm -f /var/lib/man-db/auto-update
          (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg) > "$RUNNER_TEMP/apt.log" 2>&1 &
          apt=$!
          cargo test -p craft-media --all-features --locked --no-run
          wait "$apt" || { cat "$RUNNER_TEMP/apt.log"; exit 1; }
          ffmpeg -hide_banner -version | sed -n 1p
      - run: cargo test -p craft-media --all-features --locked
        env:
          CRAFT_MEDIA_REQUIRE_ORACLES: "1"
          CRAFT_MEDIA_FIXTURES_DIR: ${{ runner.temp }}/media-fixtures
