      - "crates/docpath/**"
      - "crates/esign/**"
      - "crates/font-catalog/**"
      - "crates/font-subset/**"
      - "crates/fonts-build/**"
      - "crates/heif/**"
      - "crates/host/**"
      - "crates/i18n/**"
      - "crates/image-codecs/**"
      - "crates/jpeg/**"
      - "crates/jxl/**"
      - "crates/keymap/**"
      - "crates/media/**"
      - "crates/menu/**"
      - "crates/metadata/**"
      - "crates/pdf/**"
      - "crates/platform/**"
      - "crates/quit/**"
      - "crates/settings/**"
      - "crates/stream-codecs/**"
      - "crates/svg/**"
      - "crates/testkit/**"
      - "crates/theme/**"
      - "crates/tiff/**"
      - "crates/tracked/**"
      - "crates/ui/**"
      - "crates/ui-canvas/**"
      - "crates/ui-contract/**"
      - "crates/ui-macros/**"
      - "crates/ui-panels/**"
      - "crates/ui-patterns/**"
      - "crates/ui-shell/**"
      - "crates/ui-widgets/**"
      - "crates/video/**"
      - "crates/win32/**"
      - "crates/window/**"
      - "crates/xml/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/menu.yml"
  pull_request:
    paths:
      - "crates/appkit/**"
      - "crates/atomic/**"
      - "crates/behavior/**"
      - "crates/cloud/**"
      - "crates/cloud-ui/**"
      - "crates/codepage/**"
      - "crates/dds/**"
      - "crates/docpath/**"
      - "crates/esign/**"
      - "crates/font-catalog/**"
      - "crates/font-subset/**"
      - "crates/fonts-build/**"
      - "crates/heif/**"
      - "crates/host/**"
      - "crates/i18n/**"
      - "crates/image-codecs/**"
      - "crates/jpeg/**"
      - "crates/jxl/**"
      - "crates/keymap/**"
      - "crates/media/**"
      - "crates/menu/**"
      - "crates/metadata/**"
      - "crates/pdf/**"
      - "crates/platform/**"
      - "crates/quit/**"
      - "crates/settings/**"
      - "crates/stream-codecs/**"
      - "crates/svg/**"
      - "crates/testkit/**"
      - "crates/theme/**"
      - "crates/tiff/**"
      - "crates/tracked/**"
      - "crates/ui/**"
      - "crates/ui-canvas/**"
      - "crates/ui-contract/**"
      - "crates/ui-macros/**"
      - "crates/ui-panels/**"
      - "crates/ui-patterns/**"
      - "crates/ui-shell/**"
      - "crates/ui-widgets/**"
      - "crates/video/**"
      - "crates/win32/**"
      - "crates/window/**"
      - "crates/xml/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/menu.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: menu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    timeout-minutes: 15
    # fmt, native clippy and the tests run in the Workspace gate on every OS.
    name: Menu macOS and WASM lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin, wasm32-unknown-unknown
      # The macOS backend type-checks from Linux; it needs no linker or SDK.
      - run: cargo clippy -p craft-menu --lib --locked --target aarch64-apple-darwin -- -D warnings
      - run: cargo clippy -p craft-menu --lib --locked --target wasm32-unknown-unknown -- -D warnings
