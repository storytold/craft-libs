name: Nightly full tests

# The tests the Workspace gate shortens, in full, once a day: every hostile-input hammer and sweep
# without CRAFT_HOSTILE_DIVISOR, and every proptest at its own case count (no PROPTEST_CASES). The
# rest of the workspace's tests run with them, on Linux, with the gate's setup.
on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full:
    name: Full tests
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      os: '["ubuntu-latest"]'
      timeout-minutes: 120
      tools: cargo-nextest@0.9.150
      packages: mesa-vulkan-drivers libvulkan1
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      linux-env: WGPU_BACKEND=vulkan
      env: CRAFT_PRINT_REQUIRE_QUEUE=0
      setup-command: bash scripts/ci-test-inputs.sh
      cache-paths: .test-inputs/photocraft/corpus
      cache-key: photocraft-corpus
      cache-key-files: scripts/ci-test-inputs.sh
      # The gate's build (the same targets and profile overrides), with every test at its full count.
      command: bash scripts/ci-workspace-tests.sh full

  # The scheduled run is main's; this starts the full tests above on next too, where the gate
  # runs the same fractions. It also starts one Workspace run on next a day that nothing cancels
  # (pull requests run the Linux legs only, and pushes to next cancel each other's runs): next's
  # macOS and Windows legs then run in full at least once a day, and its Linux leg builds from
  # source and saves next's own workspace-crates cache entry, which pull requests into next
  # restore. Main gets the same from workspace.yml's own scheduled runs. The only job here with
  # `actions: write`; it checks out and runs nothing from the repository.
  workspace-next:
    name: Workspace on next
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - name: Start the Workspace workflow and these full tests on next
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run workspace.yml --repo "$REPO" --ref next
          gh workflow run nightly.yml --repo "$REPO" --ref next
