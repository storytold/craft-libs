name: Plugin SDK

on:
  push:
    branches: [main]
    paths: ["crates/plugin-sdk/**", "crates/plugin-sdk-macros/**", "crates/plugin-abi/**", "Cargo.toml", "Cargo.lock", ".github/workflows/plugin-sdk.yml"]
  pull_request:
    paths: ["crates/plugin-sdk/**", "crates/plugin-sdk-macros/**", "crates/plugin-abi/**", "Cargo.toml", "Cargo.lock", ".github/workflows/plugin-sdk.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 15
    name: Plugin SDK lint, tests, WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: craft-plugin-sdk
      - run: cargo fmt -p craft-plugin-sdk -p craft-plugin-sdk-macros --check
      - run: cargo clippy -p craft-plugin-sdk -p craft-plugin-sdk-macros --all-targets --locked -- -D warnings
      - run: cargo clippy -p craft-plugin-sdk --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test -p craft-plugin-sdk -p craft-plugin-sdk-macros --locked
      - run: cargo build -p craft-plugin-sdk --locked --target wasm32-unknown-unknown
