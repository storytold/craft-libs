name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  # A push to main is the run that publishes coverage; superseded runs there would never finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sonarcloud:
    # Track shared CI improvements on main.
    uses: storytold/craft-common-actions/.github/workflows/sonarcloud.yml@main
    with:
      pdf-test-fonts: true
      # The instrumented build runs without a dependency cache: its 1.2 GB entry does not fit the
      # repository's 10 GB cache budget beside the Workspace gate's. It runs on main only.
      build-cache: false
      # The codec and format code behind features that are off by default. Without these the
      # coverage build never compiles it, and new code there reads as untested.
      cargo-features: >-
        craft-image-codecs/avif,craft-image-codecs/avif-decode,craft-video/dnx,craft-video/vp8,craft-video/prores,craft-video/h264,craft-video/hevc,craft-video/vp9,craft-video/av1,craft-video/threads,craft-audio/decode,craft-audio/encode,craft-audio/peaks,craft-audio/rayon,craft-audio/serde,craft-media/matroska,craft-media/ogg,craft-media/bitstream,craft-media/serde,craft-mesh/stl,craft-mesh/obj,craft-mesh/ply,craft-mesh/gltf,craft-metafile/write,craft-image-codecs/sgi,craft-image-codecs/sunraster,craft-jsonrpc/async-lines
    secrets: inherit
