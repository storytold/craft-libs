name: Shared UI

on:
  push:
    branches: [main]
    paths: ["crates/ui/**", "Cargo.toml", "Cargo.lock", ".github/workflows/ui.yml"]
  pull_request:
    paths: ["crates/ui/**", "Cargo.toml", "Cargo.lock", ".github/workflows/ui.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    timeout-minutes: 30
    name: UI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install software Vulkan renderer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          echo 'WGPU_BACKEND=vulkan' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: craft-ui
      - run: cargo fmt --check
      - run: cargo clippy -p craft-ui --all-targets --locked -- -D warnings
      - run: cargo clippy -p craft-ui --all-targets --all-features --locked -- -D warnings
      - run: cargo test -p craft-ui --locked
      - run: cargo test -p craft-ui --all-features --locked
  wasm:
    timeout-minutes: 15
    name: UI WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: craft-ui-wasm
      - run: cargo check -p craft-ui --all-features --locked --target wasm32-unknown-unknown
