name: App updates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/update/**', 'Cargo.toml', 'Cargo.lock', 'rustfmt.toml', 'clippy.toml', '.github/workflows/update.yml']
  pull_request:
    paths: ['crates/update/**', 'Cargo.toml', 'Cargo.lock', 'rustfmt.toml', 'clippy.toml', '.github/workflows/update.yml']

permissions:
  contents: read

concurrency:
  # Pull requests share one group per branch, so a newer push cancels the older run. Every other
  # run (main, manual) gets a group of its own, so it is neither cancelled nor replaced while queued.
  group: update-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are kept for releases: macOS runs only when started by hand.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token isn't needed after checkout; cargo runs build scripts and proc macros from
          # dependencies, so don't leave it in .git/config for that third-party code to read.
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      # Default (no egui) and the egui feature both build and lint cleanly.
      - run: cargo clippy -p craft-update --all-targets --locked -- -D warnings
      - run: cargo clippy -p craft-update --all-targets --locked --features egui -- -D warnings
      - run: cargo test -p craft-update --locked -- --nocapture
      - run: cargo test -p craft-update --locked --features egui -- --nocapture
      # Without `native`, release parsing, versions and platforms build for the web (ArtCraft
      # Launcher's wasm32 core uses them).
      - run: cargo clippy -p craft-update --all-targets --locked --no-default-features -- -D warnings
      - run: cargo test -p craft-update --locked --no-default-features
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p craft-update --locked --no-default-features --target wasm32-unknown-unknown -- -D warnings
