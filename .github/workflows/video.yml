name: Shared video

on:
  push:
    branches: [main]
    paths: ["crates/video/**", "crates/media/**", "crates/media-testkit/**", "Cargo.toml", "Cargo.lock", ".github/workflows/video.yml"]
  pull_request:
    paths: ["crates/video/**", "crates/media/**", "crates/media-testkit/**", "Cargo.toml", "Cargo.lock", ".github/workflows/video.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 20
    name: Video lint, feature sets, docs, WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: craft-video-lint
      - run: cargo fmt -p craft-video --check
      # Each feature on its own, so code that needs another feature fails here.
      - name: Clippy, each feature alone
        run: |
          for f in "" dnx threads; do
            echo "::group::features: ${f:-none}"
            cargo clippy -p craft-video --all-targets --locked --no-default-features ${f:+--features "$f"} -- -D warnings
            echo "::endgroup::"
          done
      - run: cargo clippy -p craft-video --all-targets --locked --all-features -- -D warnings
      - run: cargo doc -p craft-video --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo check -p craft-video --all-features --locked --target wasm32-unknown-unknown
  test:
    timeout-minutes: 25
    name: Video tests with ffmpeg oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: craft-video-test
      - name: Build tests while installing ffmpeg
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg) > "$RUNNER_TEMP/apt.log" 2>&1 &
          apt=$!
          cargo test -p craft-video --all-features --locked --no-run
          wait "$apt" || { cat "$RUNNER_TEMP/apt.log"; exit 1; }
          ffmpeg -hide_banner -version | sed -n 1p
      - run: cargo test -p craft-video --all-features --locked
        env:
          CRAFT_MEDIA_REQUIRE_ORACLES: "1"
          CRAFT_MEDIA_FIXTURES_DIR: ${{ runner.temp }}/media-fixtures
