name: Shared VP9 Encoder

on:
  push:
    branches: [main]
    paths: ["crates/vp9enc/**", "Cargo.toml", "Cargo.lock", ".github/workflows/vp9enc.yml"]
  pull_request:
    paths: ["crates/vp9enc/**", "Cargo.toml", "Cargo.lock", ".github/workflows/vp9enc.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-vp9enc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 10
    name: VP9 encoder lint, tests, WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: craft-vp9enc
      - run: cargo fmt -p craft-vp9enc --check
      - run: cargo clippy -p craft-vp9enc --all-targets --locked -- -D warnings
      - run: cargo test -p craft-vp9enc --locked
      - run: cargo check -p craft-vp9enc --locked --target wasm32-unknown-unknown
