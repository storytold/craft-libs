name: Workspace

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # A full run on main every 6 hours that is never cancelled, so the caches are saved while pushes
  # to main cancel each other. The midnight run builds the Linux leg from source (`native`).
  schedule:
    - cron: "17 0 * * *"
    - cron: "17 6,12,18 * * *"

permissions:
  contents: read

concurrency:
  # A pull request, and main, each have one group, so a newer push cancels the run it supersedes;
  # the newest push's run still tests everything before it. Every other run (a release tag, a
  # manual run, the scheduled run) gets a group of its own and is neither cancelled nor replaced
  # while queued: a release run always finishes, and the scheduled run saves the caches.
  group: workspace-${{ (github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/main') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  # Whether this run needs the macOS and Windows legs, and which tests every leg runs
  # (craft-common-actions' select-platforms). A pull request runs the Linux legs only, unless it
  # has the full-ci label (see native-platforms); every other event runs the macOS and Windows legs
  # too. The tests are those of the crates a change reaches: the crates that own a changed file,
  # the crates whose Cargo.toml declares a read of it
  # (`[package.metadata.craft] reads`, which this job checks is complete), and every crate that
  # depends on those. The build setup, a crate's own Cargo.toml or a file outside the crates other
  # than documentation runs every test; documentation alone runs none. The full-ci label runs
  # everything from the next push or manual run; every other event runs everything.
  platforms:
    name: select platforms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platform: ${{ steps.select.outputs.platform }}
      tests: ${{ steps.select.outputs.tests }}
      filter: ${{ steps.select.outputs.filter }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      # The merge commit and its first parent.
      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: select
        uses: storytold/craft-common-actions/actions/select-platforms@0bef64f155fcea81edbd9542381777358bfbdcf4
        with:
          os: '["ubuntu-latest","windows-latest","macos-latest"]'
          select-os: '["windows-latest","macos-latest"]'
          select-tests: true
          label: full-ci

  # The Linux leg keeps the compiled workspace crates between runs (`cache-workspace-crates`): each
  # main run saves a rolling cache entry of its own, every run restores the newest one, and Cargo
  # rebuilds only the crates a change reaches. `cache-prune` keeps the newest entry. The midnight
  # scheduled run builds from source (`cold-build`) and starts the entry afresh. The macOS and
  # Windows legs keep a dependency-only entry: their workspace crates would not fit the 10 GB cache
  # budget beside Linux's. The lint legs keep no cache (`lint-cache: false`) for the same reason; a
  # cold lint leg is still shorter than its gate leg.
  native:
    name: Workspace
    needs: platforms
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      os: '["ubuntu-latest"]'
      cache-workspace-crates: true
      cold-build: ${{ github.event.schedule == '17 0 * * *' }}
      lint-cache: false
      # Vendored PDF/graphics backends are excluded from the workspace (Cargo.toml) and
      # compile in scripts/test-pdf-backends.sh. The unreached-rs diff check would
      # otherwise fail any edit under vendor/ as a file no workspace module reaches.
      unreached-rs-allow: |
        **/fixtures/**
        vendor/hayro*/**
        vendor/krilla/**
        vendor/linesweeper/**
        vendor/vello_*/**
      timeout-minutes: &timeout 120
      # Every leg runs its tests with nextest, and its doctests with cargo test (.config/nextest.toml).
      tools: &tools cargo-nextest@0.9.150
      packages: mesa-vulkan-drivers libvulkan1
      craft-fonts-ref: &craft-fonts b076417b5880bd4154bd22f00695b1d28c6bea83
      linux-env: WGPU_BACKEND=vulkan
      # Test binaries without debug info or symbols: about a third of the size, and a panic still
      # names its file and line.
      dev-strip: true
      # The fuzz-style tests run a fraction of their cases here: every hostile-input hammer and
      # sweep 1/8 (craft-testkit's CRAFT_HOSTILE_DIVISOR), every proptest without its own case
      # count 64 cases instead of 256. nightly.yml runs them all in full.
      # CRAFT_TESTS and CRAFT_TEST_FILTER are the `platforms` job's test selection.
      env: &env |
        CRAFT_PRINT_REQUIRE_QUEUE=0
        CRAFT_HOSTILE_DIVISOR=8
        PROPTEST_CASES=64
        CRAFT_TESTS=${{ needs.platforms.outputs.tests }}
        CRAFT_TEST_FILTER=${{ needs.platforms.outputs.filter }}
      setup-command: &setup bash scripts/ci-test-inputs.sh
      # The PhotoCraft corpora, keyed on the script that pins them: a hit skips the PhotoCraft
      # checkout and its xtask build (1:51 on Windows).
      cache-paths: &cache-paths .test-inputs/photocraft/corpus
      cache-key: &cache-key photocraft-corpus
      cache-key-files: &cache-key-files scripts/ci-test-inputs.sh
      # A `lint (<os>)` leg beside each `gate (<os>)` leg, so clippy is off the tests' critical path.
      lint-command: &lint |
        if [ "$RUNNER_OS" = Linux ]; then
          python3 scripts/test-workspace-concurrency.py
          python3 scripts/test-workspace-tests.py
        fi
        # One rustfmt call gets every source root of the workspace, which is longer than
        # Windows allows for a command line (os error 206). rustfmt's result is the same on
        # every system, so the Linux and macOS legs check it.
        if [ "$RUNNER_OS" != Windows ]; then
          cargo fmt --check
        fi
        cargo clippy --workspace --all-targets --locked -- -D warnings
        cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      command: &command |
        # The tests run once, with every feature, in parallel across test binaries; nextest skips
        # doctests, so `cargo test --doc` runs them. Examples are not built, except the two whose
        # tests run (stubicc, h264_h264enc_bench); clippy in the lint leg covers the rest. The default-feature compile is the lint leg's
        # first clippy run; the last command keeps only feature-dependent checks, matching
        # their exact legacy identities and future feature_config_ leaf names.
        # Every build is the whole workspace's, as on main; the filter narrows only the run. The
        # doctests run for the whole workspace: `cargo test -p <selected>` would resolve features
        # over the selected crates only and rebuild the dependencies whose features differ.
        if [ "$CRAFT_TESTS" = none ]; then
          echo "No crate changed: no tests to run."
          exit 0
        fi
        cargo nextest run --workspace --all-features --locked --profile ci -E "$CRAFT_TEST_FILTER" --no-tests=warn --lib --bins --tests
        cargo nextest run -p craft-aep -p craft-video --all-features --locked --profile ci -E "$CRAFT_TEST_FILTER" --no-tests=warn --example stubicc --example h264_h264enc_bench
        cargo test --workspace --doc --all-features --locked
        cargo nextest run -p craft-image-codecs -p craft-text --locked --profile ci -E "($CRAFT_TEST_FILTER) & (test(/(^|::)feature_config_[^:]*$/) | (package(=craft-image-codecs) & kind(lib) & test(/^(codecs::heif::tests::without_the_feature_heif_is_a_clear_unsupported_error)$/)) | (package(=craft-image-codecs) & binary(=it) & test(/^(decode_warnings::single_images_carry_no_warnings|detect_caps::(avif_is_readable_only_with_the_decode_feature|caps_function_matches_method|default_build_formats_all_symmetric|detect_encoded_output_of_every_format|every_enabled_format_is_symmetric_or_whitelisted|heif_is_detected_always_and_readable_only_with_the_feature|never_write_only_without_exception|sgi_requires_explicit_feature|sun_raster_disabled_by_default)|fidelity::(avif_default_build_write_unsupported|warnings_match_actual_roundtrip_behaviour)|limits::(limits_none_accepts|max_alloc_enforced_for_every_format|max_height_enforced_for_every_format|max_pixels_enforced_for_every_format|max_width_enforced_for_every_format)|malformed::(bit_flips_never_panic|byte_overwrites_in_header_never_panic|empty_input_errors_for_every_format|mutated_valid_files_never_panic|random_bytes_each_format_never_panic|random_bytes_with_magic_never_panic|truncated_at_many_offsets|truncated_files_mostly_error)|orientation::probe_size_matches_decode|roundtrip::(empty_image_rejected|one_pixel_images_roundtrip))$/)) | (package(=craft-image-codecs) & binary(=jxl_export) & test(/^(jpeg_xl_is_export_only_without_the_jxl_feature_and_detects_both_signatures)$/)) | (package(=craft-text) & kind(lib) & test(/^(hyphen::tests::language_names_and_codes|segment::tests::(breaks_are_byte_offsets_and_newlines_are_mandatory|chinese_kinsoku_keeps_punctuation_with_its_text|emergency_breaks_keep_grapheme_clusters_whole|kinsoku_adjusts_uax14_next_to_east_asian_text_only|kinsoku_keeps_closing_marks_off_line_starts_and_opening_ones_off_line_ends|kinsoku_mode_decides_whether_a_small_kana_may_start_a_line|korean_words_break_at_spaces_only|language_picks_korean_words|no_break_puts_a_closing_mark_at_a_line_start_or_an_opening_one_at_a_line_end|no_kinsoku_mode_breaks_inside_a_cluster|soft_kinsoku_lets_small_kana_and_the_prolonged_sound_mark_start_a_line|thai_without_its_feature_breaks_as_uax14))$/)))" --no-tests=warn --lib --bins --tests

  # The macOS and Windows legs, with the Linux leg's inputs. They take 1.5-2 hours against the Linux
  # leg's 15-40 minutes, so a pull request does not wait for them: they run after the merge, on
  # every push to main and on main's scheduled runs (nightly.yml starts the same on next).
  # A pull request that needs them before it merges gets the full-ci label.
  native-platforms:
    name: Workspace
    needs: platforms
    if: needs.platforms.outputs.platform == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      os: '["windows-latest","macos-latest"]'
      lint-cache: false
      timeout-minutes: *timeout
      tools: *tools
      craft-fonts-ref: *craft-fonts
      dev-strip: true
      # No debuginfo on Windows: writing PDBs for every test binary is a large part of its link
      # time. A panic still names its file and line; only backtrace frames lose theirs, and the
      # Linux and macOS legs keep line tables.
      windows-env: |
        CRAFT_PRINT_REQUIRE_QUEUE=1
        CARGO_PROFILE_DEV_DEBUG=0
      env: *env
      setup-command: *setup
      cache-paths: *cache-paths
      cache-key: *cache-key
      cache-key-files: *cache-key-files
      lint-command: *lint
      command: *command
      windows-command: |
        if [ "$CRAFT_TESTS" = none ]; then
          echo "No crate changed: no tests to run."
          exit 0
        fi
        powershell.exe -NoProfile -Command '$ErrorActionPreference = "Stop"; Start-Service Spooler; Add-PrinterDriver -Name "Generic / Text Only"'
        cargo nextest run --workspace --all-features --locked --profile ci -E "$CRAFT_TEST_FILTER" --no-tests=warn --lib --bins --tests
        cargo nextest run -p craft-aep -p craft-video --all-features --locked --profile ci -E "$CRAFT_TEST_FILTER" --no-tests=warn --example stubicc --example h264_h264enc_bench
        cargo test --workspace --doc --all-features --locked
        cargo nextest run -p craft-image-codecs -p craft-text --locked --profile ci -E "($CRAFT_TEST_FILTER) & (test(/(^|::)feature_config_[^:]*$/) | (package(=craft-image-codecs) & kind(lib) & test(/^(codecs::heif::tests::without_the_feature_heif_is_a_clear_unsupported_error)$/)) | (package(=craft-image-codecs) & binary(=it) & test(/^(decode_warnings::single_images_carry_no_warnings|detect_caps::(avif_is_readable_only_with_the_decode_feature|caps_function_matches_method|default_build_formats_all_symmetric|detect_encoded_output_of_every_format|every_enabled_format_is_symmetric_or_whitelisted|heif_is_detected_always_and_readable_only_with_the_feature|never_write_only_without_exception|sgi_requires_explicit_feature|sun_raster_disabled_by_default)|fidelity::(avif_default_build_write_unsupported|warnings_match_actual_roundtrip_behaviour)|limits::(limits_none_accepts|max_alloc_enforced_for_every_format|max_height_enforced_for_every_format|max_pixels_enforced_for_every_format|max_width_enforced_for_every_format)|malformed::(bit_flips_never_panic|byte_overwrites_in_header_never_panic|empty_input_errors_for_every_format|mutated_valid_files_never_panic|random_bytes_each_format_never_panic|random_bytes_with_magic_never_panic|truncated_at_many_offsets|truncated_files_mostly_error)|orientation::probe_size_matches_decode|roundtrip::(empty_image_rejected|one_pixel_images_roundtrip))$/)) | (package(=craft-image-codecs) & binary(=jxl_export) & test(/^(jpeg_xl_is_export_only_without_the_jxl_feature_and_detects_both_signatures)$/)) | (package(=craft-text) & kind(lib) & test(/^(hyphen::tests::language_names_and_codes|segment::tests::(breaks_are_byte_offsets_and_newlines_are_mandatory|chinese_kinsoku_keeps_punctuation_with_its_text|emergency_breaks_keep_grapheme_clusters_whole|kinsoku_adjusts_uax14_next_to_east_asian_text_only|kinsoku_keeps_closing_marks_off_line_starts_and_opening_ones_off_line_ends|kinsoku_mode_decides_whether_a_small_kana_may_start_a_line|korean_words_break_at_spaces_only|language_picks_korean_words|no_break_puts_a_closing_mark_at_a_line_start_or_an_opening_one_at_a_line_end|no_kinsoku_mode_breaks_inside_a_cluster|soft_kinsoku_lets_small_kana_and_the_prolonged_sound_mark_start_a_line|thai_without_its_feature_breaks_as_uax14))$/)))" --no-tests=warn --lib --bins --tests

  # Each main run's Linux leg saves a rolling cache entry of its own (`cache-workspace-crates`), and
  # every run restores only the newest. This deletes the older ones as soon as the Linux leg is
  # done, instead of leaving them to the 10 GB budget's eviction, which would evict other entries
  # too. The only job with `actions: write`; it checks out and runs nothing from the repository.
  cache-prune:
    name: cache prune
    needs: native
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - name: Delete all but the newest rolling entry of each job and runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `<version>-rust-<profile>-<job>-crates-<os>-<arch>-<run>-<attempt>-...`, newest first.
          gh cache list --repo "$REPO" --ref refs/heads/main --limit 100 --sort created_at --order desc --json id,key \
            --jq '.[] | "\(.id) \(.key)"' > "$RUNNER_TEMP/caches"
          declare -A kept
          while read -r id key; do
            [[ "$key" =~ ^.+-rust-[0-9a-f]{64}-(.+-crates-[A-Za-z_]+-[a-z0-9]+)-[0-9]+-[0-9]+- ]] || continue
            entry=${BASH_REMATCH[1]}
            if [ -n "${kept[$entry]:-}" ]; then
              echo "delete $key"
              gh cache delete "$id" --repo "$REPO"
            else
              kept[$entry]=1
              echo "keep $key"
            fi
          done < "$RUNNER_TEMP/caches"

  msrv:
    name: Rust 1.95
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      # Its own dependency-cache entry: the calls in this file share one job id, so without a name
      # they would write the same key.
      cache-name: msrv
      os: '["ubuntu-latest"]'
      toolchain: 1.95.0
      targets: ""
      tools: ""
      craft-fonts-ref: ""
      require-craft-fonts: false
      timeout-minutes: 15
      dev-debug: ""
      command: cargo check --workspace --lib --all-features --locked

  wasm:
    name: UI and settings WASM
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      cache-name: wasm
      os: '["ubuntu-latest"]'
      targets: wasm32-unknown-unknown
      tools: ""
      craft-fonts-ref: ""
      require-craft-fonts: false
      timeout-minutes: 15
      command: cargo check -p craft-ui -p craft-settings --all-features --locked --target wasm32-unknown-unknown
