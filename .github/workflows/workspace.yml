name: Workspace

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Workspace (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CRAFT_FONTS_DIR: ${{ github.workspace }}/.test-inputs/craft-fonts
    steps:
      - uses: actions/checkout@v4
      - name: Install software Vulkan renderer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          echo 'WGPU_BACKEND=vulkan' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace
      - name: Checkout the pinned craft-fonts inputs
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: .test-inputs/craft-fonts
          persist-credentials: false
      - name: Provision the licensed PDF test fonts
        shell: bash
        run: |
          python scripts/test-fetch-pdf-test-fonts.py
          python scripts/fetch-pdf-test-fonts.py "$RUNNER_TEMP/craft-pdf-test-fonts"
          echo "CRAFT_PDF_TEST_FONT_DIR=$RUNNER_TEMP/craft-pdf-test-fonts" >> "$GITHUB_ENV"
      - name: Prepare the Windows test driver
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Service Spooler
          Add-PrinterDriver -Name 'Generic / Text Only'
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          CRAFT_PRINT_REQUIRE_QUEUE: ${{ runner.os == 'Windows' && '1' || '0' }}
      - run: cargo test --workspace --all-features --locked
        env:
          CRAFT_PRINT_REQUIRE_QUEUE: ${{ runner.os == 'Windows' && '1' || '0' }}
  msrv:
    name: Rust 1.95 (Linux libraries)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace-msrv
      - run: cargo check --workspace --lib --all-features --locked
  wasm:
    name: UI and settings WASM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace-wasm
      - run: cargo check -p craft-ui -p craft-settings --all-features --locked --target wasm32-unknown-unknown
