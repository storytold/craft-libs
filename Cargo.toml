# symphonia's FLAC decoder restores LPC samples as `residual + (prediction as i32)`. In a valid
# 32-bit stream the prediction can leave the i32 range while the sum does not, so a debug build
# panics where a release build wraps to the right sample. Apps that decode 32-bit FLAC through
# craft-audio's `decode` need the same override in their own workspace.
[profile.dev.package.symphonia-bundle-flac]
overflow-checks = false

# Codec hot loops: the oracle and conformance tests of a debug build take minutes below opt-level 3.
[profile.dev.package.craft-video]
opt-level = 3

# The object-stream parser follows nesting 384 levels deep: unoptimised, its frames overflow the
# 2 MiB stack of a test thread. The apps this reader came from build their crates at this level.
[profile.dev.package.craft-affinity]
opt-level = 1
# Dev and test builds never run LTO: with `lto = false` (cargo's default) rustc runs thin-local LTO across every
# optimised crate's 256 codegen units on each rebuild, which multiplied the incremental rebuild of the framework
# crates. Off, a one-line edit re-optimises only the changed units.
[profile.dev]
lto = "off"

# Dependencies (egui, rendering, text shaping, syn) run optimised in dev and test builds, so
# screen tests, design-lint and the debug gallery run at a usable speed. They build once per
# target dir; the workspace's own crates stay unoptimised and incremental.
[profile.dev.package."*"]
opt-level = 2

# The workspace crates whose code runs in every screen-test frame (the framework runtime, the theme's colour maths
# and the behaviour cores), and craft-proof, whose tests parse and check whole dictionaries, build at opt-level 1:
# unoptimised, they made the test binaries several times slower. The crates above the runtime (widgets, panels,
# canvas, patterns, shell) stay at opt-level 0: their code is a few percent of a frame, and at opt-level 0 a one-line
# edit rebuilds in seconds instead of the better part of a minute.
[profile.dev.package.craft-ui-contract]
opt-level = 1
[profile.dev.package.craft-theme]
opt-level = 1
[profile.dev.package.craft-behavior]
opt-level = 1
[profile.dev.package.craft-proof]
opt-level = 1

# The gallery on the Mac: optimised like release, but the workspace's crates build in many small
# units, incrementally, so a change to craft-ui rebuilds in minutes. Dependencies keep release
# settings and build once in target/gallery. `cargo run --profile gallery -p craft-ui-gallery`.
[profile.gallery]
inherits = "release"
incremental = true
codegen-units = 256
opt-level = 1

# The workspace's own crates build at opt-level 1 in the gallery profile: rustc shares generic instantiations across
# crates at opt-level 0, 1, s and z only, so at 1 a change in a framework crate no longer makes every dependant
# re-generate its own copies of that crate's generics and inlined functions (a one-line edit rebuilt the gallery in
# 25 s at opt-level 1 and 69–84 s at 3). `package."*"` matches the dependencies only: they keep release optimisation,
# so this changes nothing in their settings.
[profile.gallery.package."*"]
codegen-units = 16
opt-level = 3
