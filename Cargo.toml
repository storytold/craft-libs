[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/craft-libs"

[workspace.dependencies]
# internal: add each crate here as `craft-<name> = { path = "crates/<name>" }`
craft-atomic = { path = "crates/atomic" }
craft-cloud = { path = "crates/cloud" }
craft-gpu = { path = "crates/gpu" }
craft-gpu-null = { path = "crates/gpu-null" }
craft-gpu-providers = { path = "crates/gpu-providers" }
craft-gpu-wgpu = { path = "crates/gpu-wgpu" }
craft-print = { path = "crates/print" }
craft-quit = { path = "crates/quit" }
craft-runtime = { path = "crates/runtime" }
craft-settings = { path = "crates/settings" }
craft-tier-store = { path = "crates/tier-store" }
craft-ui = { path = "crates/ui" }
craft-worker-host = { path = "crates/worker-host" }
egui = { version = "0.36", default-features = false }

# foundation. Versions match the ones the app repos already pin.
log = "0.4"
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
pollster = "0.4"
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
