[package]
name = "craft-ask-agent"
description = "Ask Agent: hand a selection and an instruction to the person's own agent (MCP / control channel), with the shared request queue and bubble."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# `ui`: the chip and the bubble for egui apps.
egui = ["dep:egui"]

[dependencies]
egui = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
