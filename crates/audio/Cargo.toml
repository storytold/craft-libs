[package]
name = "craft-audio"
description = "Audio file I/O and codecs: WAV/AIFF read and write, FLAC encoder, AAC, MP1/MP2, AC-3/E-AC-3 and Opus decoders, AAC and Opus encoders."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Probe and decode: WAV and AIFF natively; AAC, MP1/MP2, AC-3/E-AC-3, Opus and PCM through
# craft-media's demuxers and this crate's decoders; MP3, FLAC, ALAC, Vorbis, CAF, ADPCM, A-law and
# µ-law through symphonia.
decode = ["craft-media/bitstream", "craft-media/isobmff", "craft-media/matroska", "craft-media/ogg", "dep:symphonia", "dep:log"]
# Encode WAV/BWF/RF64, AIFF/AIFF-C and FLAC; the AAC and Opus packet encoders.
encode = ["craft-media/bitstream"]
# Multi-resolution waveform overviews (`peaks`).
peaks = []
# Encode AAC channels in parallel.
rayon = ["dep:rayon"]
# Serialize and Deserialize for the shared types.
serde = ["dep:serde", "craft-media/serde"]

[dependencies]
craft-media = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
log = { version = "0.4", optional = true }
rayon = { workspace = true, optional = true }
symphonia = { version = "0.6.1", optional = true, default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm", "aiff", "isomp4", "aac", "alac", "adpcm", "caf", "mkv"] }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "audio"
required-features = ["decode", "encode", "peaks"]

[[test]]
name = "codecs"
required-features = ["decode", "encode"]
