[package]
name = "craft-captions"
description = "Caption and subtitle files behind one neutral model: SubRip, WebVTT, Scenarist SCC, MacCaption MCC, EBU STL, ASS, TTML/IMSC1/DFXP and the legacy text formats (MicroDVD, MPL2, SubViewer, VPlayer, SAMI) readers and writers with exact time, and CEA-608/708 coding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# MP4 timed text (3GPP TS 26.245 / mov_text / tx3g) sample codec.
mov-text = []

[dependencies]
craft-timeline = { workspace = true }
craft-xml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
craft-testkit = { workspace = true }
proptest = { workspace = true }
# A second XML reader for the tests: checks of written TTML, and the comparison in tests/it/ttml_xml_views.rs.
roxmltree = "0.21"
# ffmpeg as the reference for the ASS tests (tests/it/ass.rs).
craft-media-testkit = { workspace = true }
# craft-media isobmff for mov_text oracle demuxing/muxing tests.
craft-media = { workspace = true, features = ["isobmff"] }
