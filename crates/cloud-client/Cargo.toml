[package]
name = "craft-cloud-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "How a Craft app talks to CollabCraft: sign in, browse, open, save, share. No provider credential and no provider protocol"

[lints]
workspace = true

[dependencies]
craft-cloud = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Blocking, because the apps calling this are not async.
#
# platform-verifier, because a CollabCraft behind an internally signed
# certificate is the normal case and ureq defaults to Mozilla's roots only.
# That default fails with "invalid peer certificate: UnknownIssuer", which
# names neither the certificate nor the store it was missing from. The platform
# verifier reads the operating system's own trust store, so a CA already
# enrolled on the machine works with nothing shipped in the binary.
#
# Enabling the native-tls feature alone would not have helped: the provider
# still has to be selected, and it defaults to rustls either way.
ureq = { version = "3", features = ["json", "platform-verifier"] }
