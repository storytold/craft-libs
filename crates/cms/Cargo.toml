[package]
name = "craft-cms"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Pure-Rust ICC v2/v4 colour management: profile parsing and writing, transforms, rendering intents, black point compensation"
# The FOGRA39 measurement data and the tests that read it stay in the repository.
exclude = ["tests/data", "tests/fogra39.rs"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true, optional = true }

[features]
# Serialize and deserialize `Intent` and `TransformOptions`, for documents and settings.
serde = ["dep:serde"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
moxcms = "0.8"
serde_json = { workspace = true }
