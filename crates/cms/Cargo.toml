[package]
name = "craft-cms"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Pure-Rust ICC v2/v4 colour management: profile parsing and writing, transforms, rendering intents, black point compensation"
# The FOGRA39 measurement data and the tests that read it stay in the repository.
exclude = ["tests/data", "tests/fogra39.rs"]

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
moxcms = "0.8"
serde_json = "1"
