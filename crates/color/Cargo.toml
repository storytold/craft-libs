[package]
name = "craft-color"
description = "Colour for Craft apps: the colour picker, wells, swatch tables, ramps and the hex field."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autotests = false

[lib]
# The lib's test target is the crate's one test executable: its trials and, with `screen-testing`, the
# screen tests in tests/it.
harness = false

[lints]
workspace = true

[features]
default = []
# The colour widgets (`craft_color::ui`).
ui = ["dep:craft-behavior", "dep:craft-keymap", "dep:craft-ui", "dep:egui", "dep:craft-settings", "dep:craft-window", "craft-platform/screen"]
# Screenshot and input tests of the widgets with egui_kittest (desktop only).
screen-testing = ["ui", "craft-ui/testing"]

[dependencies]
craft-behavior = { workspace = true, optional = true }
craft-cms = { workspace = true }
craft-host = { workspace = true }
craft-i18n = { workspace = true }
craft-keymap = { workspace = true, optional = true }
craft-platform = { workspace = true }
craft-settings = { workspace = true, optional = true }
craft-theme = { workspace = true }
craft-ui = { workspace = true, optional = true }
craft-window = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
serde = { workspace = true }

[dev-dependencies]
craft-ui = { workspace = true, features = ["testing"] }
egui = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }
