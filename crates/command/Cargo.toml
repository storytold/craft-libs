[package]
name = "craft-command"
description = "Command registry, hooks and change feed shared by the Craft apps: commands added at run time, a gate on each call, a document change feed and a JSON Schema per command."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# The `conformance` module: a `CommandHost` trait and `run_all`, so each app runs the same checks.
testing = []

[dependencies]
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "execute"
harness = false

[lints]
workspace = true
