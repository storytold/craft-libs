[package]
name = "craft-dds"
description = "DirectDraw Surface (DDS) textures: uncompressed and BC1-BC5 block compression, read and write, without dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Encode and decode rows of blocks (and mip levels) on several threads.
parallel = ["dep:rayon"]

[dependencies]
rayon = { workspace = true, optional = true }
