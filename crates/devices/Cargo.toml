[package]
name = "craft-devices"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Device tools shared by the Craft apps: the scan job journal (large piles and manual duplex as one job) and its read-only views, with no UI and no platform code"

[lints]
workspace = true

[dependencies]
craft-atomic = { workspace = true }
craft-scan = { workspace = true, features = ["serde"] }
craft-job = { workspace = true, features = ["serde"] }
serde_json = "1"
