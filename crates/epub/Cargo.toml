[package]
name = "craft-epub"
description = "EPUB packages: the OCF ZIP container, the package document (manifest, spine, metadata) and the navigation document, written (EPUB 3, reflowable and fixed layout) and read (EPUB 2 and 3) with bounded reads."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# `doc`: a book's content documents read into the craft-flow model, through craft-html.
doc = ["dep:craft-flow", "dep:craft-html"]

[dependencies]
craft-xml = { workspace = true }
thiserror = { workspace = true }
craft-zip = { workspace = true }
craft-flow = { workspace = true, optional = true }
craft-html = { workspace = true, features = ["flow"], optional = true }

[dev-dependencies]
# The tests build hostile archives by hand.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
craft-zip = { workspace = true, features = ["test-support"] }
# The book tests convert a joined flow to a document to see its lists.
craft-wordmodel = { workspace = true }

[[test]]
name = "doc"
required-features = ["doc"]
