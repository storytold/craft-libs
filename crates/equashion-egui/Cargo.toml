[package]
name = "equashion-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "equaSHion egui widget: the equation editor (canvas, palette, linear field) with no host types"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
equashion-math = { workspace = true }
equashion-layout = { workspace = true, features = ["extra-fonts"] }
equashion-render = { workspace = true, features = ["raster", "extra-fonts"] }
egui = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }
# The native example only (glow keeps the build small; no wgpu).
eframe = { workspace = true, features = ["default_fonts", "glow", "x11", "wayland"] }

[[example]]
name = "widget"
