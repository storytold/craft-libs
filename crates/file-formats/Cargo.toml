[package]
name = "craft-file-formats"
description = "Shared bounded file signature and extension resolution for Craft applications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
craft-eps = { workspace = true }
craft-image-codecs = { workspace = true, optional = true }
craft-idml = { workspace = true }
craft-svg = { workspace = true }
craft-zip = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# These flags report which shared parser/codec families a client builds. The application still
# selects the corresponding shared crates in its dependency graph.
raster-codecs = ["dep:craft-image-codecs"]
heif = ["raster-codecs", "craft-image-codecs/heif"]
avif = ["raster-codecs", "craft-image-codecs/avif"]
pdf = []
svg = []
ora = []
kra = []
xcf = []
pdn = []
raw = []
psd = []
affinity = []
pcraft = []
ase = []
office = []
designcraft = []
stencilcraft = []
plotter = []

[lints]
workspace = true
