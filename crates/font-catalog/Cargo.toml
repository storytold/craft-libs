[package]
name = "craft-font-catalog"
description = "Installed fonts for the Craft apps: discovery on every platform, family, style and PostScript lookup, and loading shared between threads."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["system"]
# The platform's font service through fontique: CoreText on macOS, DirectWrite on Windows,
# fontconfig on Linux and FreeBSD. The same version and features craft-ui's system fonts use, so
# the apps build fontique once.
system = ["dep:fontique"]

[dependencies]
skrifa = { version = "0.47", default-features = false, features = ["std"] }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[dev-dependencies]
write-fonts = "0.54"

[lints]
workspace = true
