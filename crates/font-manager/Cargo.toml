[package]
name = "craft-font-manager"
description = "Craft Font Manager as a library: search and filters over the font indexes (Google Fonts, Noto, user-added sources), installed fonts by family, the font store interface, and the egui panel the launcher and the standalone app show."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
# Every test lives in the `it` integration binary, so `cargo test` builds the library once.
test = false

[features]
default = []
# `FontsPanel`: the whole interface as one egui panel, with the picker, the Glyphs panel, the axis sliders and the
# Missing Fonts dialog.
ui = ["dep:craft-behavior", "dep:craft-theme", "dep:egui", "dep:craft-ui", "dep:craft-host", "dep:serde", "dep:log", "dep:skrifa"]
# The widgets' stories and trials (`tests/it`).
screen-testing = ["ui", "craft-ui/testing", "dep:epaint_default_fonts"]

[dependencies]
craft-font-catalog = { workspace = true }
craft-i18n = { workspace = true }
# The pinned built-in indexes compiled in, for browsing offline.
craft-font-store = { workspace = true, features = ["bundled-index"] }
# egui's default faces lead the interface font stack.
egui = { workspace = true, features = ["default_fonts"], optional = true }
# The story's installed faces.
epaint_default_fonts = { version = "0.37", optional = true }
# A host that wants installed fonts for characters its interface faces lack (language names in
# their own scripts in the language filter) enables craft-ui's `system_fonts` itself.
craft-ui = { workspace = true, optional = true }
# The Host: settings section, jobs and interface language.
craft-host = { workspace = true, optional = true }
craft-behavior = { workspace = true, optional = true }
craft-theme = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
log = { version = "0.4", optional = true }
# Variation axes and named instances of a face (`axes`).
skrifa = { version = "0.44", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
craft-font-manager = { path = ".", features = ["screen-testing"] }

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false
required-features = ["screen-testing"]

[lints]
workspace = true
