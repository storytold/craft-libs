[package]
name = "craft-gpu-filters"
description = "Gaussian blur, per-channel lookup tables and source-over compositing of premultiplied RGBA8 images on the GPU, as a craft-gpu provider, with a CPU reference of the same filters"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
craft-gpu = { workspace = true }
thiserror = { workspace = true }

# The compute passes wait for the device, which a wasm32 build cannot do, so wgpu is native only.
# The crate enables no wgpu backend itself: the caller's device brings its own.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
craft-gpu-null = { workspace = true }

# The oracle tests open a real adapter when the machine has one, so the tests turn the native
# backends on.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = { workspace = true }
wgpu = { workspace = true, features = ["vulkan", "metal", "dx12"] }
