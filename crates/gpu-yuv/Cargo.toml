[package]
name = "craft-gpu-yuv"
description = "RGBA to NV12, P010 and I420 on the GPU with scaling, in BT.601, BT.709 and BT.2020 at limited or full range, as a craft-gpu provider, with a CPU reference of the same conversion"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
craft-gpu = { workspace = true }
wgpu = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }

# The device tests (src/tests.rs) open a native adapter. The backends are on for this crate's own
# tests only; crates that depend on craft-gpu-yuv get the workspace wgpu with `std` and `wgsl`.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wgpu = { workspace = true, features = ["dx12", "metal", "vulkan", "gles"] }

[dev-dependencies]
craft-gpu-null = { workspace = true }
pollster = { workspace = true }
# The independent reference the oracle tests compare with (BSD-3-Clause OR Apache-2.0).
yuv = { version = "0.8.20", default-features = false, features = ["professional_mode"] }
