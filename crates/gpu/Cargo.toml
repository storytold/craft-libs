[package]
name = "craft-gpu"
description = "GPU start-up choices per platform for Craft apps on eframe's wgpu backend: backends, power preference, DX12 compiler and the Linux DRM device pick."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# A `[patch.crates-io]` row at the framework root points egui-wgpu at the pinned egui fork; it is not a workspace dependency.
# Its `wgpu` re-export is the wgpu eframe draws with.
egui-wgpu = { version = "0.37", default-features = false }
log = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Waits for the DirectX 12 adapter list of the start-up probe.
pollster = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
