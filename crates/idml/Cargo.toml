[package]
name = "craft-idml"
description = "IDML (InDesign Markup Language) packages: the ZIP container read with bounded part sizes and written, designmap includes, the Properties form of IDML's XML, value codecs, and InDesign Tagged Text."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
craft-xml = { workspace = true }
thiserror = { workspace = true }
craft-zip = { workspace = true }

[dev-dependencies]
# The tests build hostile archives by hand.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
craft-zip = { workspace = true, features = ["test-support"] }
