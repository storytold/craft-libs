[package]
name = "craft-jxl"
description = "JPEG XL image decoding and encoding with bounded input and allocation tracking."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["decode", "encode"]
decode = ["dep:jxl-oxide"]
encode = ["dep:jixel"]

[dependencies]
jxl-oxide = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
craft-cms = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jixel = { workspace = true, optional = true }
