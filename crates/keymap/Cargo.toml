[package]
name = "craft-keymap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Keyboard bindings for the Craft suite: chords, keymaps, conflicts, overrides and shortcut-set import"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = { workspace = true, optional = true }

[dev-dependencies]
craft-settings = { workspace = true }
tempfile = "3"

[features]
egui = ["dep:egui"]
