[package]
name = "craft-keymap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Keyboard bindings for the Craft suite: chords, keymaps, conflicts, overrides and shortcut-set import"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = { workspace = true, optional = true }
craft-ui = { workspace = true, optional = true }
craft-i18n = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
global-hotkey = { version = "0.9", optional = true }

# The systems where global-hotkey grabs keys through X11.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
x11rb = { version = "0.13.1", optional = true }

[dev-dependencies]
# `serde` for setting `RawInput` fields only the suite's egui fork has; `default_fonts` for the
# dialog's tests.
egui = { workspace = true, features = ["serde", "default_fonts"] }
craft-settings = { workspace = true }
tempfile = "3"
sha2 = "0.10"
egui_kittest = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
egui = ["dep:egui"]
# The Keyboard Shortcuts dialog.
ui = ["egui", "dep:craft-ui", "dep:craft-i18n"]
# System-wide hotkeys (the `global` module); not built for wasm32.
global = ["dep:global-hotkey", "dep:x11rb"]
# Screenshots of the dialog for review (tests/ui_snapshot.rs; needs a GPU or software adapter).
snapshot = ["ui", "egui_kittest/wgpu"]
