[package]
autotests = false
name = "craft-keymap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Keyboard bindings for the Craft suite: chords, keymaps, conflicts, overrides and shortcut-set import"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The `.kys` reader.
roxmltree = "0.21"
egui = { workspace = true, optional = true }
craft-i18n = { workspace = true }
craft-host = { workspace = true }

[dev-dependencies]
# `serde` for setting `RawInput` fields only the suite's egui fork has.
egui = { workspace = true }
craft-settings = { workspace = true }
tempfile = "3"

[features]
# The egui key conversions.
egui = ["dep:egui", "craft-host/ui"]
