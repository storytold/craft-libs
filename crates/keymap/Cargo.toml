[package]
name = "craft-keymap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Keyboard bindings for the Craft suite: chords, keymaps, conflicts, overrides and shortcut-set import"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = { workspace = true, optional = true }
craft-ui = { workspace = true, optional = true }
craft-i18n = { workspace = true, optional = true }

[dev-dependencies]
# `serde` for setting `RawInput` fields only the suite's egui fork has; `default_fonts` for the
# dialog's tests.
egui = { workspace = true, features = ["serde", "default_fonts"] }
craft-settings = { workspace = true }
tempfile = "3"
egui_kittest = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
egui = ["dep:egui"]
# The Keyboard Shortcuts dialog.
ui = ["egui", "dep:craft-ui", "dep:craft-i18n"]
# Screenshots of the dialog for review (tests/ui_snapshot.rs; needs a GPU or software adapter).
snapshot = ["ui", "egui_kittest/wgpu"]
