[package]
name = "craft-link-core"
description = "Transport-neutral identities, revisions and durable semantic link transactions"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
native = ["dep:rusqlite", "dep:craft-atomic", "dep:sha2", "uuid/v4"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { version = "1", features = ["serde"] }
sha2 = { version = "0.10", optional = true }
craft-atomic = { workspace = true, optional = true }
rusqlite = { version = "0.38", features = ["bundled"], optional = true }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "transactions"
required-features = ["native"]
