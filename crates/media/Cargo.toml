[package]
name = "craft-media"
description = "Bit-level I/O, clean-room ISO BMFF (MP4), QuickTime (MOV) and Matroska (MKV, WebM) demuxers and muxers, and Ogg and AVI demuxers."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = ["isobmff"]
bitstream = []
isobmff = ["bitstream", "dep:thiserror"]
matroska = []
# AVI (RIFF) and OpenDML demuxer (`craft_media::avi`).
avi = []
# Ogg demuxer (Ogg Opus and Vorbis mapping, `craft_media::ogg`).
ogg = []
# Serialize and Deserialize for `Container`, `CodecId`, `CodecParams` and `PcmFormat`.
serde = ["dep:serde"]

[dependencies]
thiserror = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
craft-media-testkit = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "fuzz"
required-features = ["isobmff"]

[[test]]
name = "fuzz_matroska"
required-features = ["matroska"]

[[test]]
name = "oracle_avi"
required-features = ["avi"]

[[test]]
name = "oracle_demux"
required-features = ["isobmff"]

[[test]]
name = "oracle_matroska"
required-features = ["matroska"]

[[test]]
name = "oracle_mux"
required-features = ["isobmff"]

[[test]]
name = "oracle_ogg"
required-features = ["ogg"]

[[test]]
name = "roundtrip"
required-features = ["isobmff"]
