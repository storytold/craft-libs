[package]
name = "craft-mesh"
description = "3D mesh file formats behind one neutral model: STL, Wavefront OBJ/MTL, PLY and glTF 2.0 / GLB readers and writers, bounded on hostile input"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["stl", "obj", "ply", "gltf"]
stl = []
obj = []
ply = []
gltf = ["dep:serde_json"]

[dependencies]
serde_json = { workspace = true, optional = true }
