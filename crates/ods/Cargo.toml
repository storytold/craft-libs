[package]
name = "craft-ods"
description = "OpenDocument spreadsheets (.ods, .fods): tables with typed values, text, formulas, merges, row and column runs, notes, links and drawings, and the document's other parts as trees, on craft-odf."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# `testing`: small `.ods` packages built in code, for the tests of crates that read them.
test-support = []

[dependencies]
craft-odf = { workspace = true }
craft-sheet = { workspace = true }
craft-xml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
craft-odf = { workspace = true }
craft-ods = { path = ".", features = ["test-support"] }
