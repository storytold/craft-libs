[package]
name = "craft-prc"
description = "PRC 3D model reader and triangle-mesh writer (ISO 14739-1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
thiserror = { workspace = true }
craft-mesh = { workspace = true, optional = true }

[features]
# `mesh_scene_from`: a craft-mesh scene (glTF, OBJ, STL, ...) as a `MeshScene`.
mesh = ["dep:craft-mesh"]

[dev-dependencies]
proptest = { workspace = true }
