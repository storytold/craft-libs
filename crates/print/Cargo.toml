[package]
name = "craft-print"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "System PDF print spooler for the Craft apps: CUPS and Windows"

[dependencies]
# Safe API; Win32 calls are isolated in this maintained MIT OR Apache-2.0 dependency.
craft-winprint-gdi = { git = "https://github.com/storytold/winprint.rs", rev = "417ac3c4d14d3da5485a99c7d5ce8f05664ec312" }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
# Printing without starting anything (storytold/pdfcraft#1107): the printer list (EnumPrinters)
# and the job (Windows.Data.Pdf drawn with Direct2D into the XPS print API, options as a
# PrintTicket) are safe wrappers over Win32 and WinRT (BSD-3-Clause). Its default `pdfium`
# feature downloads PDFium at build time and is off. The maintained BSD-3-Clause fork
# preserves terminal failures/cancellation and bounds the completion notification wait.
# Pinned to an immutable revision; review before bumping.
# Temporarily not immutable: until storytold/winprint.rs#6 (`GdiPdfPrinter`, for src/fallback.rs)
# merges, pinned to its PR ref, which moves with the PR: replace it with the merged revision
# (`rev = "<sha>"`, then `cargo update -p winprint`) before merging this.
winprint = { git = "https://github.com/storytold/winprint.rs", rev = "refs/pull/6/head", default-features = false }
# The HRESULT inside winprint's errors (MIT OR Apache-2.0), to tell a print system refusing the
# XPS job from other failures (src/fallback.rs). The version winprint's `windows` 0.62 uses.
windows-result = "0.4"
# GetDefaultPrinter (MIT).
winsafe = { version = "0.0.29", default-features = false, features = ["winspool"] }
# The job file's private folder.
tempfile = "3"
# Reading the PrintTicket and PrintCapabilities the driver hands back.
roxmltree = "0.20"
# Inflating the print-ready PDF's cross-reference and object streams (src/sheets.rs).
miniz_oxide = "0.8"

[dev-dependencies]
tempfile = "3"
roxmltree = "0.20"
miniz_oxide = "0.8"
