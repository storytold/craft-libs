[package]
name = "craft-proof"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Proofing per language for the Craft Apps: spelling, suggestions, grammar checks and hyphenation, a Hunspell .aff/.dic reader, and user and ignored words. Language data is embedded from craft-i18n at build time (CRAFT_I18N_DIR)."
build = "build.rs"

[lints]
workspace = true

[dependencies]
log = "0.4"
miniz_oxide = "0.9"
unicode-normalization = "0.1"

[dev-dependencies]
proptest = { workspace = true }
