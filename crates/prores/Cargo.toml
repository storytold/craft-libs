[package]
name = "craft-prores"
description = "Clean-room pure-Rust Apple ProRes (SMPTE RDD 36) decoder and encoder for the Craft ecosystem"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
filmcraft-bitstream = { package = "craft-bitstream", path = "../bitstream" }
thiserror = { workspace = true }
rayon = { workspace = true, optional = true }
