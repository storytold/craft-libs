[package]
name = "craft-ps"
description = "PostScript and EPS for Craft apps: writing primitives, and an EPS interpreter that paints into PDF"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
read = ["dep:craft-eps", "dep:pdf-writer", "dep:miniz_oxide", "dep:weezl", "dep:skrifa", "dep:kurbo"]
write = ["dep:kurbo", "dep:flate2"]

[dependencies]
craft-eps = { workspace = true, optional = true }
pdf-writer = { workspace = true, optional = true }
miniz_oxide = { workspace = true, optional = true }
weezl = { workspace = true, optional = true }
skrifa = { workspace = true, optional = true }
kurbo = { workspace = true, optional = true }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"], optional = true }

[dev-dependencies]
craft-testkit = { workspace = true }

[[example]]
name = "eps2pdf"
required-features = ["read"]
