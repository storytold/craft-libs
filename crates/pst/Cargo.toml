[package]
name = "craft-pst"
description = "Outlook personal folders files (.pst, [MS-PST]): a reader over any Read + Seek of the node database, property and table contexts, folders, messages, recipients, attachments and named properties."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# The test writer (`test_writer`): synthetic .pst files for the tests of code that reads them.
# A dev-dependency feature only.
test-support = []
# The earlier name of `test-support`, kept as an alias that turns it on.
test-writer = ["test-support"]

[lints]
workspace = true

[dependencies]

[dev-dependencies]
craft-testkit = { workspace = true }
craft-pst = { path = ".", features = ["test-support"] }
proptest = { workspace = true }
