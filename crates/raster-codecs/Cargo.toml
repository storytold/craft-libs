[package]
name = "craft-raster-codecs"
description = "Small raster image formats, one module each: DDS (with BC1-BC3), DICOM, FITS, IFF/ILBM, PCX, PNM/PAM/PFM and XPM, with bounded decoding."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }

# The DDS encoder compresses rows of blocks in parallel on native; wasm stays single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }
