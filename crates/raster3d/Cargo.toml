[package]
name = "craft-raster3d"
description = "CPU rasterizer for prepared 3D scenes: clipping, depth-buffered triangles, metallic-roughness shading, shadow maps, box resolve and sRGB encoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
parallel = ["dep:rayon"]

[lints]
workspace = true

[dependencies]
rayon = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
# The headless test and example light their scene with an environment made by craft-pbr.
craft-pbr = { workspace = true }
# The differential tests run a verbatim copy of the app's previous code, which uses rayon.
rayon = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The headless test lists the wasm32 example's imports and runs it.
craft-wasm = { workspace = true }
wasmi = { version = "2", default-features = false, features = ["std", "validate", "portable-dispatch"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
