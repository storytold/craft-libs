[package]
name = "craft-shared-vec"
description = "An ordered, indexed list whose clones share storage: a counted B-tree of shared blocks, so an edit copies only the blocks on its path, with share-aware byte counts for undo history."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Serialize and Deserialize as a plain sequence, the same as `Vec<T>`.
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
craft-shared-vec = { path = ".", features = ["serde"] }
proptest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
