[package]
name = "craft-spp-reader"
description = "Reads SPP project containers and decompiles their embedded material graphs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
adler2 = "2"
crc32fast = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode", "safe-encode"] }
# Unpacks graph packages (7z, LZMA) to read their compiled graphs. Apache-2.0.
sevenz-rust2 = { version = "0.24", default-features = false }
# Image resources saved by version 12.2 are JPEG 2000. Pure Rust, Apache-2.0 OR MIT.
hayro-jpeg2000 = { version = "0.5", default-features = false, features = ["std", "simd"] }
# JPEGs stored inside compiled graphs (other than baseline greyscale ones, decoded here). MIT OR Apache-2.0 OR Zlib.
zune-jpeg = "0.5"
zune-core = "0.5"

[dev-dependencies]
# Writes small 7z archives for the graph package tests.
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }

[lints]
workspace = true

[features]
# Developer tools in examples/ that read local project files. Off by default, so `cargo test` (the CI gate) does
# not build them; run one with `cargo run -p craft-spp-reader --features dev-tools --example <name> -- ...`.
dev-tools = []

[[example]]
name = "decals"
required-features = ["dev-tools"]

[[example]]
name = "import_inspect"
required-features = ["dev-tools"]

[[example]]
name = "layers"
required-features = ["dev-tools"]
