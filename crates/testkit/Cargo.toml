[package]
name = "craft-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Source-level platform regression guards, test deadlines, hostile-input helpers, a reentrant test lock and skip-or-fail helpers for the Craft application suite"
publish = false

[features]
# `font-coverage`: `skip::craft_fonts_cover`, which parses font data with skrifa.
font-coverage = ["dep:skrifa"]

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
skrifa = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "11.0.0", default-features = false, features = ["std", "job-object", "kill-on-drop"] }

[lints]
workspace = true
