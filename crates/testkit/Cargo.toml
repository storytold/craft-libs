[package]
name = "craft-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Source-level platform regression guards, test deadlines, hostile-input helpers and a reentrant test lock for the Craft application suite"
publish = false

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
