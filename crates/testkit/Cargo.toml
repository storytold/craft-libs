[package]
name = "craft-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Source-level platform regression guards, test deadlines, hostile-input helpers and a reentrant test lock for the Craft application suite"
publish = false

[features]
# `prop::config`: a proptest configuration with a pinned seed and no failure persistence.
prop = ["dep:proptest"]

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
proptest = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }

[[test]]
name = "prop"
required-features = ["prop"]

[lints]
workspace = true
