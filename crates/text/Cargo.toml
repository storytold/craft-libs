[package]
name = "craft-text"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Text processing below the Craft composer: hyphenation with a bundled US English dictionary and patterns, other languages through hypher"

[lints]
workspace = true

[dependencies]
hypher = { version = "0.1.8", default-features = false, features = ["alloc"], optional = true }
miniz_oxide = { version = "0.8", optional = true }
unicode-linebreak = { version = "0.1.5", optional = true }
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
unicode-bidi = { version = "0.3.18", optional = true }
unicode-bidi-mirroring = { version = "0.4.0", optional = true }

[dev-dependencies]
unicode-segmentation = "1.13"

[[example]]
name = "hyphgen"
required-features = ["generator"]

[features]
default = ["hyphen", "bidi", "segment", "linebreak"]
# Hyphenation points; English (bundled dictionary and patterns) needs no further feature.
hyphen = ["dep:hypher", "dep:miniz_oxide"]
# Bidirectional text: embedding levels, line reordering and mirroring (UAX #9).
bidi = ["dep:unicode-bidi", "dep:unicode-bidi-mirroring"]
# Line breaking on a box/glue/penalty model (Knuth–Plass, greedy, balanced); no dependencies.
linebreak = []
# The dictionary writer (`hyphen::dict`) and pattern trainer (`hyphen::patgen`) used by
# examples/hyphgen.rs.
generator = ["hyphen"]
# Line-break opportunities (UAX #14 with kinsoku); Thai, Lao, Khmer and Burmese words need their
# language feature.
segment = ["dep:unicode-linebreak"]
# Each feature below adds the data for one more language: for `hyphen`, hypher's patterns (see
# NOTICE for their licenses); for `segment`, ICU4X's word data for Thai, Lao, Khmer and Burmese
# (one shared data set, Unicode License v3).
all-languages = [
    "afrikaans",
    "albanian",
    "assamese",
    "belarusian",
    "bengali",
    "bulgarian",
    "burmese",
    "catalan",
    "croatian",
    "czech",
    "danish",
    "dutch",
    "estonian",
    "finnish",
    "french",
    "galician",
    "georgian",
    "german",
    "greek",
    "gujarati",
    "hindi",
    "hungarian",
    "icelandic",
    "italian",
    "kannada",
    "khmer",
    "kurmanji",
    "lao",
    "latin",
    "lithuanian",
    "malayalam",
    "marathi",
    "mongolian",
    "norwegian",
    "oriya",
    "panjabi",
    "polish",
    "portuguese",
    "russian",
    "sanskrit",
    "serbian",
    "slovak",
    "slovenian",
    "spanish",
    "swedish",
    "tamil",
    "telugu",
    "thai",
    "turkish",
    "turkmen",
    "ukrainian",
]
afrikaans = ["hyphen", "hypher/afrikaans"]
albanian = ["hyphen", "hypher/albanian"]
assamese = ["hyphen", "hypher/assamese"]
belarusian = ["hyphen", "hypher/belarusian"]
bengali = ["hyphen", "hypher/bengali"]
bulgarian = ["hyphen", "hypher/bulgarian"]
catalan = ["hyphen", "hypher/catalan"]
croatian = ["hyphen", "hypher/croatian"]
czech = ["hyphen", "hypher/czech"]
danish = ["hyphen", "hypher/danish"]
dutch = ["hyphen", "hypher/dutch"]
estonian = ["hyphen", "hypher/estonian"]
finnish = ["hyphen", "hypher/finnish"]
french = ["hyphen", "hypher/french"]
galician = ["hyphen", "hypher/galician"]
georgian = ["hyphen", "hypher/georgian"]
german = ["hyphen", "hypher/german"]
greek = ["hyphen", "hypher/greek"]
gujarati = ["hyphen", "hypher/gujarati"]
hindi = ["hyphen", "hypher/hindi"]
hungarian = ["hyphen", "hypher/hungarian"]
icelandic = ["hyphen", "hypher/icelandic"]
italian = ["hyphen", "hypher/italian"]
kannada = ["hyphen", "hypher/kannada"]
kurmanji = ["hyphen", "hypher/kurmanji"]
latin = ["hyphen", "hypher/latin"]
lithuanian = ["hyphen", "hypher/lithuanian"]
malayalam = ["hyphen", "hypher/malayalam"]
marathi = ["hyphen", "hypher/marathi"]
mongolian = ["hyphen", "hypher/mongolian"]
norwegian = ["hyphen", "hypher/norwegian"]
oriya = ["hyphen", "hypher/oriya"]
panjabi = ["hyphen", "hypher/panjabi"]
polish = ["hyphen", "hypher/polish"]
portuguese = ["hyphen", "hypher/portuguese"]
russian = ["hyphen", "hypher/russian"]
sanskrit = ["hyphen", "hypher/sanskrit"]
serbian = ["hyphen", "hypher/serbian"]
