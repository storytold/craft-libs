[package]
name = "craft-texture"
description = "Bounded linear float image planes and texture sampling"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
dds = ["dep:dds", "dep:bytemuck"]
parallel = ["dep:rayon"]

[lints]
workspace = true

[dependencies]
rayon = { workspace = true, optional = true }
thiserror = { workspace = true }

# Same decoder used by MaterialCraft; no parallel backend enabled.
dds = { version = "0.2.0", default-features = false, optional = true }
bytemuck = { workspace = true, optional = true }

[dev-dependencies]
dds = { version = "0.2.0", default-features = false }
bytemuck = { workspace = true }
