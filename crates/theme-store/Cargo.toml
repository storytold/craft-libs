[package]
name = "craft-theme-store"
description = "The Craft suite's theme files, machine-local theme library and shared suite selection, with a lock/revision protocol for concurrent apps. No egui."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# `SAMPLE_THEME_JSON` and its expected colours for app adapter tests, and a fault-injecting
# file system for write-failure tests.
testing = []
# serde for `Accepted` and `SuiteChoice`, which apps keep in their preferences.
serde = ["dep:serde", "craft-theme/serde"]

[dependencies]
craft-theme = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-atomic = { workspace = true }
dirs = "7"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
