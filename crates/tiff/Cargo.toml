[package]
name = "craft-tiff"
description = "TIFF and BigTIFF IFD reader and writer: every field type, the Exif/GPS/Interop pointer IFDs, maker-note IFDs, strip and tile layout."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
plain-rgba16 = ["dep:tiff"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tiff = { version = "0.11", default-features = false, optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["tiff"] }
proptest = { workspace = true }
