[package]
name = "craft-timeline"
description = "Editorial timeline interchange: exact media time and SMPTE timecode, import/export reports, Avid Log Exchange (ALE) and CMX 3600 EDL documents."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Serialize and Deserialize for the time, report and document types.
serde = ["dep:serde"]
# Final Cut Pro 7 XML (`fcp7`), read with craft-xml's bounded parser.
xml = ["dep:craft-xml"]
# OpenTimelineIO JSON (`otio`), with serde_json.
otio = ["dep:serde_json"]

[dependencies]
serde = { workspace = true, optional = true }
craft-xml = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "it"
required-features = ["xml", "otio"]
