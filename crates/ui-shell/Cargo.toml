[package]
name = "craft-ui-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The app shell and title bar of the craft UI library, and its eframe entry point"

[lib]
# Every test lives in the `it` integration binary.
test = false

[lints]
workspace = true

[features]
default = []
# `shell::app`: the eframe entry point.
app = ["dep:eframe", "craft-window/ui"]
# `craft_ui::testing`.
testing = ["craft-ui-panels/testing"]

[dependencies]
craft-ui-panels = { workspace = true }
craft-behavior = { workspace = true }
craft-theme = { workspace = true }
craft-ui-macros = { workspace = true }
egui = { workspace = true }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "x11", "default_fonts"], optional = true }
craft-host = { workspace = true }
craft-window = { workspace = true }
craft-i18n = { workspace = true, features = ["collate"] }
# The caption button icons.
resvg = { version = "0.45.1", default-features = false }
# `std::time::Instant` on native; the browser clock on wasm, where `Instant::now` panics.
web-time = "1.1"

# `shell::title_bar::sync_movable` sets `NSWindow.movable` through craft-window's AppKit code, without its egui layer.
[target.'cfg(target_os = "macos")'.dependencies]
craft-window = { workspace = true, features = ["appkit"] }

[dev-dependencies]
craft-ui-shell = { path = ".", features = ["testing"] }
craft-behavior = { workspace = true }
craft-host = { workspace = true }
craft-theme = { workspace = true }
craft-ui-test-kit = { workspace = true }
craft-window = { workspace = true }
egui = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false
