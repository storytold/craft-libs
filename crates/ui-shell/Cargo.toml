[package]
name = "craft-ui-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The app shell and title bar of the craft UI library, and its eframe entry point"

[lib]
# Every test lives in the `it` integration binary.
test = false

[lints]
workspace = true

[features]
suite = ["testing", "craft-ui-panels/suite"]
default = []
# `shell::app`: the eframe entry point.
app = ["dep:eframe"]
# `craft_ui::testing`.
testing = ["craft-ui-panels/testing"]

[dependencies]
craft-ui-panels = { workspace = true }
craft-behavior = { workspace = true }
# `open::CAN_REVEAL`: whether the start screen offers Show in Folder.
craft-platform = { workspace = true }
craft-theme = { workspace = true }
craft-ui-macros = { workspace = true }
egui = { workspace = true }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "x11", "default_fonts"], optional = true }
craft-host = { workspace = true }
# `ui`: `desktop::fits`, for `embed::before_ui`'s first fit.
craft-window = { workspace = true, features = ["ui"] }
craft-i18n = { workspace = true, features = ["collate"] }
# The saved forms of `ScreenMode`, `RecentView` and `RecentSort`.
serde = { workspace = true }
# The caption button icons.
craft-svg = { workspace = true, features = ["draw"] }
# `std::time::Instant` on native; the browser clock on wasm, where `Instant::now` panics.
web-time = "1.1"

# `embed::before_ui` takes the root window's handle (eframe's `Frame`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
raw-window-handle = "0.6"

# `AppSpec::new` installs `craft_window::system::SystemWindows`, which reads AppKit without craft-window's egui layer.
[target.'cfg(target_os = "macos")'.dependencies]
craft-window = { workspace = true, features = ["appkit"] }

[dev-dependencies]
craft-ui-shell = { path = ".", features = ["suite"] }
craft-behavior = { workspace = true }
craft-host = { workspace = true }
craft-theme = { workspace = true }
craft-ui-test-kit = { workspace = true, features = ["suite"] }
craft-window = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false
