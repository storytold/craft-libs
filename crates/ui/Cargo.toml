[package]
name = "craft-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Runtime, contract, components, patterns and shell of the craft UI library, on egui"
autotests = false

[lib]
# Every test lives in the `it` integration binary, so `cargo test` builds the library once.
test = false

[lints]
workspace = true

[features]
default = []
# `shell::app`: the eframe entry point.
app = ["craft-ui-shell/app"]
# `craft_ui::testing`: the fixture and suite runner, with every crate's test helpers.
testing = [
    "craft-ui-contract/testing",
    "craft-ui-widgets/testing",
    "craft-ui-panels/testing",
    "craft-ui-canvas/testing",
    "craft-ui-patterns/testing",
    "craft-ui-shell/testing",
]
# `craft_ui::testing::snapshot`: stories rendered to images offscreen (desktop only).
snapshot = ["testing", "craft-ui-contract/snapshot"]
# Draw colour glyphs (COLR, sbix, CBDT), e.g. colour emoji.
color_fonts = ["craft-ui-contract/color_fonts"]
# Find installed fonts for characters the app's faces lack (desktop only).
system_fonts = ["craft-ui-contract/system_fonts"]

[dependencies]
craft-ui-contract = { workspace = true }
craft-ui-widgets = { workspace = true }
craft-ui-panels = { workspace = true }
craft-ui-canvas = { workspace = true }
craft-ui-patterns = { workspace = true }
craft-ui-shell = { workspace = true }

[dev-dependencies]
craft-ui = { path = ".", features = ["testing"] }
craft-behavior = { workspace = true }
craft-i18n = { workspace = true, features = ["collate"] }
egui = { workspace = true }
syn = { version = "2", features = ["full"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false
