[package]
name = "craft-update"
description = "Release checking, downloading, installing and self-updating for the Craft App Suite and ArtCraft Launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["native"]
# Downloads, installs and self-updates. Without it only the pure parts build (release parsing,
# versions, platforms, the suite), which is what a wasm32 build can use.
native = ["dep:getrandom", "dep:tempfile", "dep:sha2", "dep:ureq", "dep:flate2", "dep:tar", "dep:plist", "dep:winreg", "dep:dunce", "dep:zip", "dep:winsafe", "dep:verifysign"]
egui = ["native", "dep:egui", "dep:image"]
local-mirror = []

[dependencies]
egui = { workspace = true, optional = true }
# Decodes the app icon the startup prompt shows (`App::icon_png`); PNG only.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
getrandom = { version = "0.3", optional = true }
tempfile = { version = "3", optional = true }
sha2 = { version = "0.10", optional = true }
ureq = { version = "3.4", optional = true, default-features = false, features = ["rustls-no-provider", "_ring", "gzip", "platform-verifier"] }
chrono = { workspace = true }
semver = { version = "1", features = ["serde"] }

[dev-dependencies]
flate2 = "1"

[target.'cfg(unix)'.dependencies]
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
plist = { version = "1", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = { version = "0.55", optional = true }
dunce = { version = "1", optional = true }
zip = { version = "9", optional = true, default-features = false, features = ["deflate"] }
winsafe = { version = "0.0.29", optional = true, features = ["advapi", "kernel", "shell", "version"] }
verifysign = { version = "1", optional = true }
