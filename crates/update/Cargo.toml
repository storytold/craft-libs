[package]
name = "craft-update"
description = "Release checking, downloading, installing and self-updating for the Craft App Suite and ArtCraft Launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
egui = ["dep:egui", "dep:image"]
local-mirror = []
# tests/dialog_screenshots.rs: renders the dialogs to PNG with egui_kittest's wgpu renderer.
snapshot = ["egui", "egui_kittest/wgpu"]

[dependencies]
egui = { workspace = true, optional = true }
# Decodes the app icon the startup prompt shows (`App::icon_png`); PNG only.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
getrandom = "0.3"
tempfile = "3"
sha2 = "0.10"
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring", "gzip", "platform-verifier"] }
chrono = { workspace = true }
semver = { version = "1", features = ["serde"] }

[dev-dependencies]
flate2 = "1"
egui_kittest = "0.37"
# egui's own Hack and Ubuntu Light for the screenshots (egui is built without default fonts).
epaint_default_fonts = "0.37"

[target.'cfg(unix)'.dependencies]
flate2 = "1"
tar = { version = "0.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
dunce = "1"
# Deflate through flate2's default (miniz_oxide) backend, as on the other platforms. zip's `deflate`
# feature adds `flate2/zlib-rs`, and features unify: that would switch flate2's backend for the
# whole app on Windows (zlib-rs's level 1 compresses far worse, so an app's fast-deflate TIFF or PNG
# export grows), and adds zopfli, which only writes archives.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
winsafe = { version = "0.0.29", features = ["advapi", "kernel", "shell", "version"] }
verifysign = "1"
