[package]
name = "craft-vcard"
description = "vCard: contacts read from vCard 2.1, 3.0 and 4.0 text (RFC 2426, RFC 6350) and written as vCard 3.0, with labels, groups, legacy character sets and KEY certificates."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
