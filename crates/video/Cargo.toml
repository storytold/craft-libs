[package]
autotests = false
name = "craft-video"
description = "Clean-room pure-Rust video codecs, one feature per codec: DNxHD/DNxHR, VP8, ProRes, H.264, HEVC, VP9, AV1, MPEG-4 Part 2, Sierra VMD."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

# Files of other crates that this crate's build or tests read. CI selects this crate's tests
# when one of them changes (craft-common-actions' select-platforms).
[package.metadata.craft]
reads = [
    "crates/jpeg/tests/data/testorig-huffman-progressive.jpg",
    "crates/jpeg/tests/data/testorig.jpg",
    "crates/jpeg/tests/data/testorig12.jpg",
    "crates/jpeg/tests/data/testorig12.ppm",
]

[features]
# FLV codec 3 / SWF Screen Video key frames.
screen-video = ["dep:miniz_oxide"]
# Every codec feature turns on one codec module; none is on by default.
# DNxHD / DNxHR (SMPTE ST 2019-1): decoder and encoder.
dnx = ["dep:craft-media"]
# APV (Advanced Professional Video, RFC 9924): decoder and encoder; `apv-decode` or `apv-encode` for one of them.
apv = ["apv-decode", "apv-encode"]
apv-decode = ["craft-media/bitstream"]
apv-encode = ["craft-media/bitstream"]
# VP8 (RFC 6386): decoder and encoder; `vp8-decode` or `vp8-encode` for one of them.
vp8 = ["vp8-decode", "vp8-encode"]
vp8-decode = ["dep:craft-media"]
vp8-encode = []
# MPEG-2 video (ITU-T H.262) and MPEG-1 video (ISO/IEC 11172-2): decoder (`mpeg2-decode`) and
# MPEG-2 encoder (`mpeg2-encode`). The encoder reuses the decoder's code tables, IDCT and motion
# compensation, so it turns on the decoder too.
mpeg2 = ["mpeg2-decode", "mpeg2-encode"]
mpeg2-decode = ["dep:craft-media"]
mpeg2-encode = ["mpeg2-decode"]
# MPEG-4 Part 2 video (ISO/IEC 14496-2, the Xvid/DivX format): Simple profile encoder.
mpeg4 = ["mpeg4-encode"]
mpeg4-encode = ["craft-media/bitstream"]
# FFV1 lossless video (RFC 9043): version 3, range coder, decoder and encoder.
ffv1 = ["dep:craft-media"]
# Hap (Vidvox): decoder and encoder, with Snappy and chunked second stages.
hap = []
# Motion JPEG: a frame-level decoder and encoder over `craft-jpeg`.
mjpeg = ["dep:craft-jpeg"]
# Apple ProRes (SMPTE RDD 36): decoder and encoder.
prores = ["craft-media/bitstream"]
# H.264 / AVC: decoder and encoder; `h264-decode` or `h264-encode` for one of them.
h264 = ["h264-decode", "h264-encode"]
h264-decode = ["craft-media/bitstream"]
h264-encode = ["craft-media/isobmff"]
# H.265 / HEVC: decoder and encoder; `hevc-decode` or `hevc-encode` for one of them.
hevc = ["hevc-decode", "hevc-encode"]
hevc-decode = ["craft-media/bitstream"]
hevc-encode = ["craft-media/isobmff"]
# VP9: decoder and encoder; `vp9-decode` or `vp9-encode` for one of them.
vp9 = ["vp9-decode", "vp9-encode"]
vp9-decode = ["craft-media/bitstream"]
vp9-encode = ["craft-media/isobmff"]
# AV1: decoder and encoder; `av1-decode` or `av1-encode` for one of them.
av1 = ["av1-decode", "av1-encode"]
av1-decode = ["dep:craft-media"]
av1-encode = ["craft-media/isobmff"]
# Tiled AV1 fallback for frames that exceed the clean-room encoder's single-tile limits.
av1-large-encode = ["av1-encode", "dep:rav1e"]
# Sierra VMD video (8-bit paletted): decoder; `vmd` turns it on too.
vmd = ["vmd-decode"]
vmd-decode = []
# Decode and encode across worker threads (rayon) in the codecs that support it.
threads = ["dep:rayon", "rav1e?/threading"]

[dependencies]
miniz_oxide = { workspace = true, optional = true }
craft-media = { workspace = true, optional = true }
craft-jpeg = { workspace = true, optional = true }
thiserror = { workspace = true }
rayon = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rav1e = { version = "0.8", default-features = false, optional = true }

[dev-dependencies]
craft-media-testkit = { workspace = true }
# The AVI muxer, for the MPEG-4 Part 2 encoder's end-to-end test; the MP4, MPEG-TS and AVI
# demuxers, for the track decoder's tests; the VMD demuxer, for the VMD decoder's.
craft-media = { workspace = true, features = ["avi", "isobmff", "mpegts", "vmd"] }

[[example]]
name = "vp8_fuzz"
required-features = ["vp8-decode"]

[[example]]
name = "vp8_vp8dec"
required-features = ["vp8-decode"]

[[example]]
name = "av1_av1dec"
required-features = ["av1-decode"]

[[example]]
name = "h264_h264dec"
required-features = ["h264-decode"]

[[example]]
name = "h264_h264enc_bench"
required-features = ["h264-encode"]
test = true

[[example]]
name = "hevc_hevcdec"
required-features = ["hevc-decode"]

[[example]]
name = "vp9_vp9dec"
required-features = ["vp9-decode"]

[[test]]
name = "it"
path = "tests/it/main.rs"
