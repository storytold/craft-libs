[package]
name = "craft-video"
description = "Clean-room pure-Rust video codecs, one feature per codec: DNxHD/DNxHR, VP8, ProRes, H.264, HEVC, VP9, AV1."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
# Every codec feature turns on one codec module; none is on by default.
# DNxHD / DNxHR (SMPTE ST 2019-1): decoder and encoder.
dnx = []
# VP8 (RFC 6386): decoder.
vp8 = []
# Apple ProRes (SMPTE RDD 36): decoder and encoder.
prores = ["craft-media/bitstream"]
# H.264 / AVC (ITU-T H.264): encoder.
h264 = ["craft-media/isobmff"]
# H.265 / HEVC: decoder and encoder; `hevc-decode` or `hevc-encode` for one of them.
hevc = ["hevc-decode", "hevc-encode"]
hevc-decode = ["craft-media/bitstream"]
hevc-encode = ["craft-media/isobmff"]
# VP9: encoder.
vp9 = ["craft-media/isobmff"]
# AV1 (AOMedia Video 1): encoder.
av1 = ["craft-media/isobmff"]
# Decode and encode across worker threads (rayon) in the codecs that support it.
threads = ["dep:rayon"]

[dependencies]
craft-media = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
craft-media-testkit = { workspace = true }

[[test]]
name = "dnx"
required-features = ["dnx"]

[[test]]
name = "vp8"
required-features = ["vp8"]

[[example]]
name = "vp8_fuzz"
required-features = ["vp8"]

[[example]]
name = "vp8_vp8dec"
required-features = ["vp8"]

[[test]]
name = "hevc_decode"
required-features = ["hevc-decode"]

[[example]]
name = "hevc_hevcdec"
required-features = ["hevc-decode"]

[[test]]
name = "prores"
required-features = ["prores"]
