[package]
name = "craft-wasm"
description = "Bounded WebAssembly module/component inspection, validation reports and WAT rendering; never executes code"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
[lints]
workspace = true
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
wasmparser = { version = "0.261", default-features = false, features = ["std", "validate", "features", "component-model", "simd"] }
wasmprinter = { version = "0.261", default-features = false, features = ["component-model"] }
[dev-dependencies]
craft-testkit = { workspace = true }
