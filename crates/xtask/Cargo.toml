[package]
name = "craft-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Library for the Craft apps' cargo xtask binaries: the gate's step runner, the asset attribution check, an optional slot lock shared across processes, a per-step JSON report, a check of pinned dependencies, the workspace version command, and .ico and .icns packing"

[lints]
workspace = true

[features]
default = []
# One-at-a-time (or N-at-a-time) gate runs per machine, through file locks in a caller-chosen folder.
lock = ["dep:libc"]
# The per-step JSON report, replaced atomically.
report = ["dep:serde_json", "dep:craft-atomic"]
# Pinned dependencies and forbidden packages, checked in `cargo metadata` (`cargo xtask pdf-deps`).
pins = ["dep:serde_json"]
# `cargo xtask stats`: files, lines and tests of Rust per workspace crate, read from `cargo metadata`.
stats = ["dep:serde_json"]
# `cargo xtask version [set X.Y.Z[-pre]]`, with Cargo.toml and Cargo.lock replaced atomically and one
# `set` at a time per workspace through `lock`.
version = ["lock", "dep:craft-atomic", "dep:toml_edit"]

[dependencies]
craft-atomic = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
toml_edit = { version = "0.25", optional = true }

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK and O_NOFOLLOW for lock and owner opens that must not wait on a FIFO or follow a symlink. Constants only.
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
