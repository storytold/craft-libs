[package]
name = "craft-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Library for the Craft apps' cargo xtask binaries: the gate's step runner, an optional slot lock shared across processes, a per-step JSON report and the workspace version command"

[lints]
workspace = true

[features]
default = []
# One-at-a-time (or N-at-a-time) gate runs per machine, through file locks in a caller-chosen folder.
lock = []
# The per-step JSON report, replaced atomically.
report = ["dep:serde_json", "dep:craft-atomic"]
# `cargo xtask version [set X.Y.Z[-pre]]`, with Cargo.toml and Cargo.lock replaced atomically and one
# `set` at a time per workspace through `lock`.
version = ["lock", "dep:craft-atomic"]

[dependencies]
craft-atomic = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
