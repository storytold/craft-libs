[package]
name = "craft-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Library for the Craft apps' cargo xtask binaries: the gate's step runner, an optional slot lock shared across processes and a per-step JSON report"

[lints]
workspace = true

[features]
default = []
# One-at-a-time (or N-at-a-time) gate runs per machine, through file locks in a caller-chosen folder.
lock = ["dep:libc"]
# The per-step JSON report, replaced atomically.
report = ["dep:serde_json", "dep:craft-atomic"]
# `cargo xtask stats`: files, lines and tests of Rust per workspace crate, read from `cargo metadata`.
stats = ["dep:serde_json"]

[dependencies]
craft-atomic = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK and O_NOFOLLOW for lock and owner opens that must not wait on a FIFO or follow a symlink. Constants only.
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
