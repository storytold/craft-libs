config_version = 1

[[exception]]
name = "print-marks-geometry"
kind = "marker"
rule = "literal-size/vec2"
path = "crates/print/src/ui/dialog.rs"
reason = "Printer's marks are page geometry in points, not UI sizes."
count = 2

[[exception]]
name = "print-story-page-sizes"
kind = "marker"
rule = "literal-size/vec2"
path = "crates/print/src/ui/stories.rs"
reason = "Page and paper sizes are document points, story data."
count = 4

[[exception]]
name = "print-paper-white"
kind = "marker"
rule = "raw-colour/const"
path = "crates/print/src/ui/dialog.rs"
reason = "The preview draws printed paper, white in every theme, and tints a colour page picture white, which leaves its own colours unchanged; neither is an interface colour."
count = 2
