config_version = 1

[[exception]]
name = "icon-trial-fixed-tint"
kind = "marker"
rule = "raw-colour/const"
path = "crates/ui-contract/src/testing/icon_trials.rs"
reason = "A fixed layer keeps the colours it is drawn in: the trial expects the white tint that leaves them unchanged."
count = 3

[[exception]]
name = "face-runs-text-size"
kind = "probe"
rule = "probe/exempt/text-size"
path = "crates/ui-contract/src/testing/face_runs.rs"
reason = "The 4,000-point run is drawn at the font atlas's cap, which is in device pixels: at twice the scale the cap, and the card, are half as many points."
count = 1
