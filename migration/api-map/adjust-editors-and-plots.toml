# API map of the "Adjust editors and plots" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Adjust editors and plots"
new_module = ""

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "CurveEditor"
old = "craft_ui::composites::curve_editor::CurveEditor"
new = "craft_imaging::ui::curve::CurveEditor"
status = "moved"
note = "A pattern over a `Bind<Curve>`: the graph, the host's rows (`between(CurveRows)`), the Input and Output fields, the Corner check box and the hint. `show(ui)` returns `CurveEditorOutput { edit: EditResponse<Curve>, selected }`. The selection comes back in the output; a host that keeps it passes `selected(Option<usize>)`. The editor clears it when `channel` changes."

[[type]]
name = "CurvePreview"
old = "craft_ui::composites::curve_editor::CurvePreview"
new = "craft_imaging::ui::curve::CurvePreview"
status = "moved"
note = "A read-only leaf: `CurvePreview::new(label, &curve)` with `levels`, `color` and `sampler`; the size comes from the theme, not from a `Vec2`."

[[type]]
name = "Curve"
old = "craft_ui::composites::curve::Curve"
new = "craft_imaging::ui::curve::Curve"
