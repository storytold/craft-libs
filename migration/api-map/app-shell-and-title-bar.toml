old = "toggle_reveal(ctx, window)"
new = ""
note = "The shell takes its window's Tab toggles itself; `clear_reveal` and `reveal_active` are gone (a screen-mode change ends a reveal)."

[[setter]]
type = "AppShell"
old = "labels(CanvasLabels)"
new = ""
