# Title bar: the bar, its title and its output (titlebar-a).

[[type]]
name = "BarSlots"
old = "craft_ui::title_bar::BarSlots"
new = ""
status = "removed"
note = "The bar's rects are the container's regions: the start end is the header, the leading content the body, the trailing content and the end's captions the end region. A body reads its room with `BodyCx::rect`."

[[type]]
name = "TitleBarResponse"
old = "craft_ui::title_bar::TitleBarResponse"
new = ""
status = "removed"
note = "Replaced by `TitleBarOutput { response, caption_clicked, close_requested }`."

[[type]]
name = "TitleBarOutput"
old = ""
new = "craft_ui::shell::TitleBarOutput"
status = "replaced"
note = "Replaces the legacy `TitleBarResponse`: `TitleBarOutput { response, caption_clicked, close_requested }`."

[[type]]
name = "LeadingEnd"
old = "craft_ui::title_bar::LeadingEnd"
new = ""
status = "removed"
note = "The caption groups sit at the physical ends the window's `Captions` layout names; a right-to-left window mirrors the Windows layout and keeps the Linux layouts as set. The bar needs no end argument."

[[type]]
name = "Title"
old = "craft_ui::title_bar::Title"
new = "craft_ui::shell::Title"
status = "moved"
note = "`Title::new(text)` and `Title::unsaved(text)`; the unsaved mark is an asterisk after the text and the description `titleBar.unsaved`. `Title::span(centre, free, width)` is the placement rule."

[[type]]
name = "TitleBarStyle"
old = "craft_ui::title_bar::TitleBarStyle"
new = "craft_ui::shell::TitleBarStyle"
status = "replaced"
note = "The 24-field `from_tokens` style is the component style: the bar's height is `SlotSize::TitleBar`, the caption colours and metrics are `CaptionButton`'s, the rule is one device pixel (`RuleKind::Divider`), the gaps are the body's row gap."

[[type]]
name = "ModalRects"
old = "craft_ui::title_bar::ModalRects"
new = ""
status = "replaced"
note = "No app step: a modal `Dialog` keeps the window draggable by the drag areas it covers. While it is the top layer it puts a `ModalDragStrip` (crate-private) on an `Overlay::modal_chrome(rect)` layer over each drag area of the window's last pass that its cover hides, less the caption buttons and the dialog itself; the layer's move band moves the window (`Overlay::moves_window`), and a double click on it acts as on the title bar (`runtime::windows::double_click_action`)."

[[type]]
name = "WindowState"
old = "craft_ui::title_bar::WindowState"
new = ""
status = "removed"
note = "The window's state is read from the window (`WindowFacts.state`); `TitleBar::maximized(bool)` overrides it for a story."

