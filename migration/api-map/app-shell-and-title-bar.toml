old = ""
new = "craft_ui::shell::ShellWords"
status = "replaced"
note = "The one word set of the shell family. Replaces `CanvasLabels`: the names of the shell's regions (ids `appShell.*`); the start screen's words, replacing `StartLabels` (ids `startScreen.*`); and the caption buttons' names and tooltips (ids `captionButton.minimize`, `maximize`, `restore` and `close`; `window.*` before)."

[[type]]
name = "CanvasOutput"
old = "craft_ui::shell::CanvasOutput"
new = ""
status = "removed"
