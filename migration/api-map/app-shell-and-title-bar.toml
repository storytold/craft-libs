status = "removed"
note = "The shell carries out a screen-mode change itself, in the pass it is made, with `WindowAction::SetFullscreen` and `SetMaximized` through `WindowHost::act`; on Windows a maximized window is restored first and maximized again after it leaves full screen."

[[type]]
name = "CYCLE_COMMAND"
old = "craft_ui::shell::CYCLE_COMMAND"
new = ""
status = "removed"
