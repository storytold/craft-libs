# API map of the "Bars" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Bars"
new_module = "craft_ui::bars"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "Toolbar"
old = "craft_ui::patterns::toolbar::Toolbar"
new = ""
status = "replaced"
note = "`Bar::new(label, BarKind::Tool)` with a `BarItems` child in its body: `BarItems::new(items)`, one `BarItem::new(command)` per old `ToolbarItem`, `.section(n)` for the group index. Items are commands, so labels, icons, shortcuts, enabled and toggle state come from the command and the output has no `clicked`: the app handles the command. A vertical strip is `Bar::vertical()` with `BarItems::axis(Axis::Y)`; overflow is automatic (`Toolbar::overflow` is gone)."

[[type]]
name = "OptionsBar"
old = "craft_ui::patterns::options_bar::OptionsBar"
new = ""
status = "replaced"
note = "`Bar::new(label, BarKind::Options)`; the body holds the cells in reading order. `OptionsBarSlots` is gone: leading, body and trailing are layout in the body. Several rows are `.rows(n)` with one `Row` per row; the commit and cancel buttons are `.commit_cancel(commit, cancel)`."

[[type]]
name = "StatusBar"
old = "craft_ui::patterns::status_bar::StatusBar"
new = ""
status = "replaced"
note = "`Bar::new(label, BarKind::Status)`; the body holds the fields in reading order. `StatusBarSlots` is gone: leading and trailing are layout in the body."

[[type]]
name = "StatusReadout"
old = "craft_ui::patterns::status_readout::StatusReadout"
new = "craft_ui::bars::StatusReadout"
status = "moved"
note = "A `Pattern` shown inside the body of a status `Bar` with `StatusReadout::new(view: Bind<CanvasView>, document: Size, item, &values).show(ui)`; `StatusReadout::new(id_salt)` and `show(ui, zoom, item, values)` are gone. The field shows the device percent of the bound view and writes a typed or scrubbed zoom into it about its centre, inside the document's zoom range. The output is `StatusReadoutOutput { response, zoom: Option<Response>, view: Option<EditEvent<CanvasView>>, item }`. `StatusReadoutLabels` is `StatusReadoutWords`; `labels(..)` is gone (words come from the scope)."

[[type]]
name = "AlignBar"
old = "craft_ui::patterns::align::AlignBar"
new = "craft_ui::bars::AlignBar"
status = "moved"
note = "A `Pattern` shown inside the body of a `Bar` with `AlignBar::new().show_in(ui, cx)`; `AlignBar::new(id_salt)`, `labels(..)` and `show(ui)` are gone. The output is `AlignBarOutput { picked, more }`. `AlignLabels` is `AlignWords`. `AlignBar::style` is gone."

[[type]]
name = "PanelFooter"
old = "craft_ui::composites::panel_footer::PanelFooter"
new = ""
status = "replaced"
note = "`FooterBar::actions([FooterAction::new(icon, label), ..]).show_footer(ui)` shows the buttons as square icon buttons under the footer region rule. `show_footer` returns `FooterOutput { picked, dropped, responses }`; `show_content` still returns the clicked index. `PanelFooter::show`, `button`, `pressed_button`, `drop_button`, `menu_button`, `drop_target`, `reserved_height` and `style` are gone; the footer region draws the rule and sizes itself."

[[type]]
name = "BreadcrumbBar"
old = "craft_ui::controls::breadcrumb::BreadcrumbBar"
new = "craft_ui::bars::BreadcrumbBar"
status = "moved"
note = "A `Component` over `&[Entry<K>]` shown with `Show::show`; `BreadcrumbBar::new(id_salt, &[Crumb<K>])` becomes `BreadcrumbBar::new(label, &[Entry<K>])`. The output is `BreadcrumbOutput { response, picked }`; `opened` is `picked`. `path_crumbs` returns `Vec<Entry<String>>`. `Crumb` is `Entry`; `BreadcrumbLabels` is `BreadcrumbWords`; `labels(..)` and `BreadcrumbBar::style` are gone."

[[type]]
name = "ToolbarItem"
old = "craft_ui::patterns::toolbar::ToolbarItem"
new = ""
status = "replaced"
note = "`ToolbarItem::new(icon, label)` is `craft_ui::bars::BarItem::new(command)`: the command carries label, icon, shortcut and enabled state. `.toggle(&mut bool)` is a toggle command whose checked state the app publishes; `.shortcut(..)` is the command's binding."

[[type]]
name = "ToolbarStyle"
old = "craft_ui::patterns::toolbar::ToolbarStyle"
new = ""
status = "removed"
note = "`BarItemsStyle` and `BarStyle` are component styles; sizes come from `ControlSize` and the theme. `Toolbar::style(tokens)` is gone."

[[type]]
name = "OptionsBarStyle"
old = "craft_ui::patterns::options_bar::OptionsBarStyle"
new = ""
status = "removed"
note = "`BarStyle`; `OptionsBar::height_of` is gone: a bar is as tall as its tallest member plus the control padding."

[[type]]
name = "StatusBarStyle"
old = "craft_ui::patterns::status_bar::StatusBarStyle"
new = ""
status = "removed"
note = "`BarStyle`; `StatusBar::style(tokens)` is gone."

[[type]]
name = "ToolbarResponse"
old = "craft_ui::patterns::toolbar::ToolbarResponse"
new = ""
status = "removed"
note = "`BarItems` returns a `Response` and fires the item's command; the app takes the command. `items` (per-item responses) has no replacement."

[[type]]
name = "CommitCancel"
old = "craft_ui::patterns::options_bar::CommitCancel"
new = ""
status = "replaced"
note = "`BarOutput { committed, cancelled }` from a bar built with `Bar::commit_cancel(commit, cancel)`."

[[type]]
name = "StatusProgress"
old = "craft_ui::patterns::status_bar::StatusProgress"
new = ""
status = "replaced"
note = "A `Progress` (`Progress::new(fraction)` or `Progress::indeterminate()`) with a `Text` percent and a cancel `IconButton`, in the bar's body."

[[type]]
name = "StatusProgressOutput"
old = "craft_ui::patterns::status_bar::StatusProgressOutput"
new = ""
status = "replaced"
note = "The cancel `IconButton`'s response: `clicked(&response)`."

[[type]]
name = "UnitCellResponse"
old = "craft_ui::patterns::options_cell::UnitCellResponse"
new = ""
status = "replaced"
note = "The `NumberField`'s `EditResponse` inside a `Field`; the unit is `NumberField::unit_kind(UnitKind)`."

