[[type]]
name = "StatusValues"
old = "craft_ui::patterns::status_readout::StatusValues"
new = "craft_ui::bars::StatusValues"
status = "moved"
note = "`current_tool` is `Option<CommandRef>` (the readout shows the command's label) and `document_dimensions` is `Option<PixelSize>` (shown through `Units`); neither is app-formatted text."

[[type]]
name = "StatusReadoutOutput"
old = "craft_ui::patterns::status_readout::StatusReadoutOutput"
new = "craft_ui::bars::StatusReadoutOutput"
status = "moved"
note = "`zoom` is the zoom field's `Response`; the zoom edit is `view: Option<EditEvent<CanvasView>>`."

[[type]]
name = "AlignBarResponse"
old = "craft_ui::patterns::align::AlignBarResponse"
new = ""
status = "replaced"
note = "`AlignBarOutput { picked, more }`; `response` is `more`, the menu button response."

[[type]]
name = "AlignStyle"
old = "craft_ui::patterns::align::AlignStyle"
new = ""
status = "removed"
note = "Sizes come from `ControlSize` and the bar; the bar has no style struct to read."

[[type]]
name = "FooterAction"
old = "craft_ui::composites::panel_footer::FooterAction"
new = "craft_ui::sections::FooterAction"
status = "moved"
note = "`FooterAction::new(id, icon, label)` is `FooterAction::new(icon, label)`; the id is the index in the order given. `enabled(bool)` is kept; `accepts_drops(bool)` is `accepts_drops::<P>(fn(&P) -> bool)`, and the drop comes back in `FooterOutput::dropped`."

[[type]]
name = "PanelFooterStyle"
old = "craft_ui::composites::panel_footer::PanelFooterStyle"
new = ""
status = "removed"
note = "The footer region draws its rule and takes its height from the footer bar."

[[type]]
name = "BreadcrumbBarResponse"
old = "craft_ui::controls::breadcrumb::BreadcrumbBarResponse"
new = ""
status = "replaced"
note = "`BreadcrumbOutput { response, picked }`; `opened` is `picked`."

[[type]]
name = "BreadcrumbStyle"
old = "craft_ui::controls::breadcrumb::BreadcrumbStyle"
new = ""
status = "replaced"
note = "`BreadcrumbBarStyle`: sizes and colours come from the component style; there is no `BreadcrumbBar::style(tokens)`."

[[type]]
name = "Crumb"
old = "craft_ui::controls::breadcrumb::Crumb"
new = ""
status = "replaced"
note = "`Crumb { label, key }` is `craft_ui::contract::Entry::new(key, label)`."

[[setter]]
