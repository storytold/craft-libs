# canvas-navigate-a: navigation input, the view tools, momentary tools and zoom motion.

[[type]]
name = "NavigationOptions"
old = "craft_ui::canvas::navigate::NavigationOptions"
new = "craft_ui::canvas::NavigationOptions"
status = "moved"
note = "Plain data, `#[non_exhaustive]`: build it with `NavigationOptions::default()` and assign the fields. The fields and their defaults are unchanged."

[[type]]
name = "WheelNavigation"
old = "craft_ui::canvas::navigate::WheelNavigation"
new = "craft_ui::canvas::WheelNavigation"
status = "moved"
note = "A value that keeps the unfinished part of a ladder-step notch: `WheelNavigation::default()`, then `read(&mut self, &Wheel, &NavigationOptions)` or `classify(&mut self, WheelInput, &NavigationOptions)`. `Canvas` reads its wheel share with it and applies it to the view it reports (there is no `CanvasOutput::wheel` or `pan`); `read(ctx, response, prefs)`, `read_page`, `classify_page`, `settle`, `configure` and `fold_legacy_pinch` are gone (the wheel service owns the device reads and the modifier mapping). `apply(view, action, pointer, size, pixels_per_point)` no longer takes the options or clamps: with Overscroll off the canvas clamps with `CanvasScrollbars::clamp`."

[[type]]
name = "WheelAction"
old = "craft_ui::canvas::navigate::WheelAction"
new = "craft_ui::canvas::WheelAction"
status = "moved"
note = "Same variants (`Zoom`, `SnapZoom`, `Pan`)."

[[type]]
name = "WheelInput"
old = "craft_ui::canvas::navigate::WheelInput"
new = "craft_ui::canvas::WheelInput"
status = "moved"
note = "Built with `WheelInput::of(&Wheel)`; fields `scroll`, `zoom`, `mods`, `notch`. The smoothed and raw scroll pair, `alt` and `shift` are gone: the modifiers are `mods`."

[[type]]
name = "PageKey"
old = "craft_ui::canvas::navigate::PageKey"
new = "craft_ui::canvas::PageKey"
status = "moved"
note = "`PageKey::of(NavMove, MoveMods, canvas: Vec2)` reads the move a focused canvas takes (`Intents::take_move`) instead of an egui key; `handle`, `handle_where` and `apply(view, size, overscroll)` become `apply(view, size)` (the caller clamps)."

[[type]]
name = "FlickPan"
old = "craft_ui::canvas::navigate::FlickPan"
new = "craft_ui::canvas::FlickPan"
status = "moved"
note = "A value the Hand tool or the app keeps: `drag(now, delta)`, `release(now, enabled)`, `advance(now) -> Option<Vec2>`, `gliding()`, `stop()`. It holds no egui memory; `frame`, `advance_view` and the `CanvasId` key are gone."

[[type]]
name = "TouchpadGlide"
old = "craft_ui::canvas::navigate::TouchpadGlide"
new = "craft_ui::canvas::TouchpadGlide"
status = "moved"
note = "`TouchpadGlide::new(enabled)` (the app decides the platform) and `read(&Wheel, now, glide)`; it reads the wheel share, not egui events. `default()` is gone."

[[type]]
name = "Autoscroll"
old = "craft_ui::canvas::navigate::Autoscroll"
new = "craft_ui::canvas::Autoscroll"
status = "moved"
note = "`edge_step` and `scroll` are unchanged; the app runs them from `ToolHostResponse::past_edge`."

