# API map of the "Colour controls and panels" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Colour controls and panels"
new_module = ""

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""
[[type]]
name = "Paint"
old = "craft_color::ui::Paint"
new = "craft_color::ui::Paint"
status = "same"
note = "`ImagePreview.texture` is `Option<CachedTexture>`; the `size` field is the texture's. `GradientPreview` and `ImagePreview` have constructors (`new`)."

[[type]]
name = "GradientPreview"
old = "craft_color::ui::GradientPreview"
