# Prompts: one entry per public type and per renamed, removed or reshaped setter.

[[type]]
name = "Prompt"
old = "craft_ui::dialog::prompt::Prompt"
new = "craft_ui::dialog::Prompt"
status = "replaced"
note = "A pattern on `Dialog::prompt`: `Prompt::new(title, message).answers([FooterButton::new(label, DialogRole::Accept).letter('Y'), ..]).opened(Bind::bound(&mut open)).show(ui)`. It takes no `Context`, id or stack; the output is `PromptOutput { response, closed, picked }` with the answer as an index in the order given."

[[type]]
name = "StandardPrompt"
old = "craft_ui::dialog::prompts::StandardPrompt"
new = "craft_ui::dialog::StandardPrompt"
status = "replaced"
note = "Still a `StackDialog` on the host. App texts are `Label`s the scope's catalog translates, so `arg` is gone; the \"Don't show again\" choice is reported in `PromptAnswer::skip` and the app stores it (craft-ui has no craft-settings dependency)."

[[type]]
name = "PromptKind"
old = "craft_ui::dialog::prompts::PromptKind"
new = "craft_ui::dialog::PromptKind"
status = "moved"

[[type]]
name = "PromptChoice"
old = "craft_ui::dialog::prompts::PromptChoice"
new = "craft_ui::dialog::PromptChoice"
status = "moved"

[[type]]
name = "PromptAnswer"
old = "craft_ui::dialog::prompts::PromptAnswer"
new = "craft_ui::dialog::PromptAnswer"
status = "moved"
note = "Adds `skip`: the box was ticked with a Proceed answer."

[[type]]
name = "PromptLabels"
old = "craft_ui::dialog::prompts::PromptLabels"
new = "craft_ui::dialog::PromptLabels"
status = "replaced"
note = "A `words!` set with ids `prompt.camelCase` (`prompt.confirmDelete.title` is `prompt.confirmDeleteTitle`); `of_ctx` is `Env::words::<PromptLabels>()`. It also holds the shared `cancel` and `ok` words."

[[type]]
name = "Alert"
old = "craft_ui::dialog::alert::Alert"
new = "craft_ui::dialog::Alert"
status = "replaced"
note = "A pattern: `Alert::new(title, message).opened(Bind::bound(&mut open)).show(ui)`; `PromptOutput::picked` is `Some(0)` the pass it closes. It takes no id or stack."

[[type]]
name = "UnsavedChangesDialog"
old = "craft_ui::dialog::unsaved::UnsavedChangesDialog"
new = "craft_ui::dialog::UnsavedChangesDialog"
status = "replaced"
