new = "craft_ui::dialog::UnsavedLabels"
status = "replaced"
note = "A `words!` set; read it with `Env::words::<UnsavedLabels>()` instead of `of_ctx`."

[[type]]
name = "RecoveryDialog"
old = "craft_ui::dialog::recovery::RecoveryDialog"
new = "craft_ui::dialog::RecoveryDialog"
status = "replaced"
note = "The same `StackDialog`, on `Prompt`; `show` takes `&mut Ui`. Escape and the close action are `DialogResult::Cancel`."

[[type]]
name = "RecoveredDocument"
old = "craft_ui::dialog::recovery::RecoveredDocument"
new = "craft_ui::dialog::RecoveredDocument"
status = "replaced"
note = "Built with `RecoveredDocument::new(key, name, age: Duration)` and `.blocked(reason)`; `saved: SystemTime` is `age`, how long before the listing the copy was autosaved. The blocked reason shows as a warning line under the message."

[[type]]
