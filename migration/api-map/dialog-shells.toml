# API map of the "Dialog shells" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Dialog shells"
new_module = "craft_ui::dialog"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "Dialog"
old = "craft_ui::dialog::dialog::Dialog"
new = "craft_ui::dialog::Dialog"
status = "replaced"
note = "A container: `Dialog::new(title).opened(Bind::bound(&mut open)).show(ui, |ui, cx| ..)`. It takes no `Context`, `DialogState` or fields; the open state is a binding and the body edits the app's values directly."

[[type]]
name = "DialogFrame"
old = "craft_ui::dialog::frame::DialogFrame"
new = "craft_ui::dialog::DialogFrame"
status = "replaced"
note = "A container in the parent's flow: `DialogFrame::new(title).show(ui, |ui, cx| ..)`. `DialogFrameResponse` is gone: the output is a `Response`."

[[type]]
name = "FullWindowDialog"
old = "craft_ui::dialog::full_window::FullWindowDialog"
new = "craft_ui::dialog::FullWindowDialog"
status = "replaced"
note = "A container on `Mount::FullWindow`: `FullWindowDialog::new(title).opened(..).show(ui, |ui, cx| ..)`. `FullWindowFx` is gone: footer buttons are the footer closure's content."

[[type]]
name = "DialogHost"
old = "craft_ui::dialog::dialog_host::DialogHost"
new = "craft_ui::dialog::DialogHost"
status = "moved"
note = "`show(ctx)` is `run(ui)`; a `StackDialog::show` takes `&mut Ui` and its dialog is a container shown from it."

[[type]]
name = "StackDialog"
old = "craft_ui::dialog::dialog_host::StackDialog"
new = "craft_ui::dialog::StackDialog"
status = "moved"
note = "`show(&mut self, ctx: &Context, stack)` is `show(&mut self, ui: &mut Ui, stack)`."

[[type]]
name = "DialogResult"
old = "craft_ui::dialog::dialog_host::DialogResult"
new = "craft_ui::dialog::DialogResult"
status = "moved"

[[type]]
name = "StartupStage"
old = "craft_ui::dialog::dialog_host::StartupStage"
new = "craft_ui::dialog::StartupStage"
status = "moved"

[[type]]
name = "DialogStack"
old = "craft_ui::dialog::stack::DialogStack"
new = "craft_ui::dialog::DialogStack"
status = "moved"
note = "Routing only: the overlay host makes the top modal layer the one that takes input, so `Dialog::stack` and the whole-dialog disable are gone."

[[type]]
name = "dialog_id"
old = "craft_ui::dialog::stack::dialog_id"
new = "craft_ui::dialog::dialog_id"
status = "moved"

[[type]]
name = "DialogId"
old = "craft_ui::dialog::stack::DialogId"
new = "craft_ui::dialog::DialogId"
status = "moved"

[[type]]
name = "BlockingOverlay"
old = "craft_ui::dialog::blocking::BlockingOverlay"
new = "craft_ui::dialog::BlockingOverlay"
status = "replaced"
note = "A container: `BlockingOverlay::new(name).card(true).show(ui, |ui, cx| ..)` while the work lasts. `show(ctx) -> bool` (cancelled) becomes the open binding turning false."

[[type]]
name = "Outcome"
old = "craft_ui::dialog::Outcome"
new = ""
status = "removed"
note = "`Dialog::on_close(|why| ..)` reports how the dialog closed as a `CloseReason`: `Escape` is the cancel, `Enter` the OK of `close_on_enter(true)`, and a footer button calls `FooterCx::request_close_as(why)` (`Activated` for OK, `Requested` for Cancel). The close action reports `Requested`."

[[type]]
name = "DialogResponse"
old = "craft_ui::dialog::DialogResponse"
new = ""
status = "removed"
note = "The open binding and the footer closure replace `outcome`, `closed`, `opened`, `active` and `alternate`; `initial_focus`, `outer` and `history` are not reported."

[[type]]
name = "DialogState"
old = "craft_ui::dialog::DialogState"
new = ""
status = "removed"
note = "The open binding is the state; the container saves placement and size under its `SaveKey`."

[[type]]
name = "Backdrop"
old = "craft_ui::dialog::Backdrop"
new = "craft_ui::runtime::overlay::Backdrop"
status = "moved"
note = "`Backdrop::None` stays the transparent backdrop. A `Dialog` defaults to `Backdrop::Scrim`; call `.backdrop(Backdrop::None)` for the old look."

[[type]]
name = "InitialFocus"
old = "craft_ui::dialog::InitialFocus"
new = ""
status = "replaced"
note = "Auto and FirstField are `Initial::First`, DefaultButton is `Initial::Default`, Field(id) is `Initial::Key(name)`, None is `Initial::Keep`."

[[type]]
name = "EnterRule"
old = "craft_ui::dialog::EnterRule"
new = "craft_ui::runtime::focus::EnterRule"
status = "replaced"
note = "`Default` is `Submit`, `Body` is `Pass`."

[[type]]
name = "KeyInput"
old = "craft_ui::dialog::KeyInput"
new = ""
status = "removed"
note = "`resolve_keys` is the focus scope's Escape and Enter rules."

[[type]]
