# API map of the "Docking and panes" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Docking and panes"
new_module = "craft_ui::docking"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "DockArea"
old = "craft_ui::docking::surface::DockArea"
new = "craft_ui::patterns::dock::DockArea"
status = "moved"
note = "A pattern: `DockArea::new(label, Bind<Workspace<P>>, &mut dyn DockPanels<P>, DockConfig)` and `show(ui) -> DockAreaOutput<P>` (legacy `DockArea::new(id)` and `show(ui, layout, ..)`); the root's id comes from the label under the parent's id and, inside an `AppShell`, the window's key. The area applies its actions to a bound workspace itself, with `DockPanels::permissions` (narrowed by `locked`); no apply loop in the app. `DockArea::read_only(label, &Layout<P>, ..)` shows a layout that is not edited."

[[type]]
name = "FloatingFrame"
old = "craft_ui::docking::chrome::FloatingFrame"
new = ""
status = "removed"
note = "Replaced by `craft_ui::docking::FloatingGroup`: a container on a layer (or an OS window with `native`) whose rect the caller owns. The eight edge handles are the body step's grips, the title bar is a `TitleRow`, auto height follows the caller's rect."

[[type]]
name = "TitleBar"
old = "craft_ui::docking::chrome::TitleBar"
# `craft_ui::title_bar::TitleBar` is the window's title bar (title-bar tracks).
new = ""
status = "removed"
note = "The docking title bar is the `TitleRow` of `FloatingGroup` and of dock groups, with `HeaderAction::{Menu, Float, Close}`."

[[type]]
name = "PaneHost"
old = "craft_ui::panes::PaneHost"
new = ""
status = "removed"
note = "Replaced by `craft_ui::patterns::dock::PaneArea`: docked panes are shell panes on the area's edges, floating panes are `FloatingGroup` frames, and `show` takes the closure that fills what the docked panes leave."

[[type]]
name = "ResizeHandle"
old = "craft_ui::layout::resize::ResizeHandle"
new = ""
status = "removed"
note = "A docked pane's size comes from `PaneState::size` through the shell pane's extent; a floating pane's edges are the body step's grips."

[[type]]
name = "resize_edges"
old = "craft_ui::docking::render::native::resize_edges"
new = ""
status = "replaced"
note = "Internal band of a native dock window; the float frame on `Mount::Viewport` resizes the window through its body-step grips."

[[type]]
name = "resize_bands"
old = "craft_ui::docking::render::native::resize_bands"
new = ""
status = "replaced"
note = "Internal; the eight zones are the float frame's body-step grips."

[[type]]
name = "PanelLimits"
old = "craft_ui::docking::PanelLimits"
new = ""
status = "removed"
note = "Replaced by `craft_ui::contract::SizeLimits`, the one size-limits value that `PanelSpec::limits` and `Overlay::size_limits` take: `SizeLimits::new(min, max)`, `at_least` or `at_most`; the fields `min` and `max: Option<Vec2>` stay public; `valid` is public and the 1,000,000 bound is `SizeLimits::BOUND`."

# Final fix pass (l4z-body): one size-limits value.
[[type]]
name = "SizeLimits"
old = ""
new = "craft_ui::contract::SizeLimits"
status = "replaced"
note = "The smallest size and an optional largest, in points: a dock panel's body limits (`PanelSpec::limits`) and a layer's resize limits (`Overlay::size_limits(limits)`). `around(extra)` gives the limits of a frame around such a size. It replaces `craft_ui::docking::PanelLimits`."

[[type]]
name = "DockHeights"
old = "craft_ui::docking::DockHeights"
new = "craft_ui::docking::DockHeights"
status = "same"
note = "`valid` is public; the builders are `const`."

[[type]]
name = "DockConfig"
old = "craft_ui::docking::DockConfig"
new = "craft_ui::docking::DockConfig"
status = "same"
note = "Behaviour fields only, with a builder per field. The label fields are `DockWords`; the band, zone, cascade-inset and float sizes are `DockSizes`, resolved from the theme by `DockSizes::style(cx)` in the dock's component style; `right_to_left` is the env's direction; `panel_menu` and `min_tab_width` are gone (panel rows come from `DockPanels::panel_rows`, tabs fit by the strip's kind). `Sides` is `DockSides`."

[[type]]
name = "Sides"
old = "craft_ui::docking::Sides"
new = ""
status = "replaced"
note = "`DockSides { start, end, top, bottom }`: the horizontal pair follows the reading direction."

[[type]]
name = "DockEvent"
old = "craft_ui::docking::DockEvent"
new = "craft_ui::docking::DockEvent"
status = "same"
note = "`PanelCommand { panel, command }` carries the `DockCommands` only the host carries out (Move Panel To and Move Group To ask for a destination); the menu rows are commands and run in the group's scope. Adds `ColumnPlaced { anchor, rect }` (the anchor is a panel of the column's first group) and `FloatPlaced { panel, rect }`."

[[type]]
name = "FloatSpace"
old = "craft_ui::docking::FloatSpace"
new = "craft_ui::docking::FloatSpace"
status = "same"
note = "`FloatSpace::new(area, &DockSizes)` takes the default float size, the cascade inset and the title row height from the sizes; the lookups `panel`, `group`, `column` and `place` are public; `place` returns a `Rect`."

[[type]]
name = "HidePanels"
old = "craft_ui::docking::HidePanels"
new = "craft_ui::docking::HidePanels"
status = "same"

[[type]]
name = "WindowKind"
old = "craft_ui::docking::WindowKind"
new = ""
status = "replaced"
note = "`craft_host::target::WindowKind`: `Palette` is `Tool` and `Normal` is `Document`. `PanelSpec::window_kind` holds it."

[[type]]
name = "DockContent"
old = "craft_ui::docking::DockContent"
new = ""
status = "replaced"
note = "`DockPanels<P>`: `spec(&P) -> PanelSpec` carries the label, icon, limits, heights, float size, native and window-kind policy; `body`, `group_view(panels, active, ui, at: GroupAt, cx) -> Option<f32>` (was `custom_group(panels, active, floating)`; it shows or measures the group and returns its height when it takes it), `group_header(panels, active, ui, cx)` and `panel_rows` stay hooks; a group is named by one of its panels. Permissions are the dock model's, read through `DockPanels::permissions`."

[[type]]
name = "ZoneRule"
old = "craft_ui::docking::ZoneRule"
new = "craft_ui::docking::ZoneRule"
status = "same"
note = "`Depth` or `Fraction`; `zones(body, &DockSizes, rtl)` gives non-overlapping rects by `craft_behavior::dock::zones`, with `Start` on the right under right-to-left."

[[type]]
name = "DropTarget"
old = "craft_ui::docking::DropTarget"
new = ""
status = "replaced"
note = "`DockTargets::register(ctx, dock, spot, rect)` registers `DockSpot`s (a group is named by an anchor panel) with hit rects for one dock; `DockTargets::resolve(ctx, dock, at)` resolves a pointer against the previous pass to `(DockSpot<P>, Rect)` (the rect the mark applies to; `register_in` gives it, `register` uses the hit rect), only inside the dock's `DropTarget::accept`; `DockSpot::mark(rect, rtl)` gives the `DropMark` (dock-drop-a adds the model step)."

