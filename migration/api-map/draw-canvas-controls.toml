# API map of the "draw canvas controls" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "draw canvas controls"
new_module = "craft_draw::ui"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "CropFrame"
old = ""
new = ""
status = "pending"

[[type]]
name = "PenDraft"
old = "craft_draw::ui::pen::PenDraft"
new = ""
status = "removed"
note = "The draft is the canvas tool `PenTool`: the host shows it with `ToolHost::run` and drains `PenTool::take_events`."

[[type]]
name = "GradientOverlay"
old = "craft_draw::ui::GradientOverlay"
new = "craft_draw::ui::gradient::GradientOverlay"
status = "replaced"
note = "A canvas control: `new(label, Bind<LineGradient>)` over the canvas's view, snap and arena. The host-driven `hit`, `press`, `track`, `release`, `double_click`, `paint` and `paint_focus` are gone: the arena gives a press on a part to the overlay."

[[type]]
name = "STOP_STEP"
old = ""
new = "craft_draw::ui::gradient::stops::STOP_STEP"
status = "replaced"
note = "New documented const: the share of the bar or line one Left or Right press moves a stop or midpoint."

[[type]]
name = "STOP_STEP_FAR"
old = ""
new = "craft_draw::ui::gradient::stops::STOP_STEP_FAR"
status = "replaced"
note = "New documented const: the share one Shift+arrow press moves a stop or midpoint."


