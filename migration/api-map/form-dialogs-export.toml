old = "craft_ui::dialog::export::OutputPathResponse"
new = ""
status = "removed"
note = "Replaced by `OutputPathOutput { response, edit: Option<EditEvent<String>>, browse: Option<PathRequest> }`; `browsing` (a pick ticket) is the request."

[[type]]
name = "OutputPathOutput"
old = ""
new = "craft_ui::patterns::form_dialogs::OutputPathOutput"
status = "replaced"
note = "`{ response, edit, browse }`."

[[call]]
