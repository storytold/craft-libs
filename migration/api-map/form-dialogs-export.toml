old = ""
new = "craft_ui::patterns::form_dialogs::JpegPreset"
status = "replaced"
note = "`Low`, `Medium`, `High` and `Maximum`; `jpeg_quality_preset(quality)` says which one a quality falls in and `quality()` the value a preset sets."

[[type]]
name = "OutputPathRow"
old = "craft_ui::dialog::export::OutputPathRow"
new = "craft_ui::patterns::form_dialogs::OutputPathRow"
status = "moved"
note = "A pattern: `OutputPathRow::new(Bind<String>)` with `templates(Vec<(String, Label)>)`, `kind`, `key` and `label`; `show(ui) -> OutputPathOutput`. The path is a text field with a Browse button (the old file-name link with Alt-click editing), and Browse files a `PathRequest` in the output instead of queueing a picker ticket."

[[type]]
name = "OutputPathLabels"
old = "craft_ui::dialog::export::OutputPathLabels"
new = ""
status = "removed"
note = "Replaced by `OutputPathWords`."

[[type]]
name = "OutputPathWords"
old = ""
new = "craft_ui::patterns::form_dialogs::OutputPathWords"
status = "replaced"
note = "The words of the output path row (`outputPath.*` ids)."

[[type]]
