[[type]]
name = "FormatOptionsDialog"
old = ""
new = "craft_ui::patterns::form_dialogs::FormatOptionsDialog"
status = "replaced"
note = "A pattern over `ParamDialog`: `FormatOptionsDialog::new(ExportOptionsKind)` with `opened` and `initial(FormatOptions)` (the old `own_quality` and constructor arguments); `show(ui) -> FormatOptionsOutput { response, closed, result: Option<FormatOptions> }`."

[[type]]
name = "ExportOptionsKind"
old = ""
new = "craft_ui::patterns::form_dialogs::ExportOptionsKind"
status = "replaced"
note = "`Jpeg`, `Tiff`, `Targa` and `Dds`."

[[type]]
name = "FormatOptions"
old = ""
new = "craft_ui::patterns::form_dialogs::FormatOptions"
status = "replaced"
note = "The options of one format: `Jpeg(JpegOptions)`, `Tiff(TiffOptions)`, `Targa(TargaOptions)` or `Dds(DdsOptions)`; the result of `FormatOptionsDialog`."

[[type]]
name = "FormatOptionsOutput"
old = ""
new = "craft_ui::patterns::form_dialogs::FormatOptionsOutput"
status = "replaced"
note = "`{ response, closed, result }`."

[[type]]
name = "JpegFormat"
