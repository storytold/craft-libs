# API map of the "Form dialogs 3: export" family (Export As, the format options, the output path row).

family = "Form dialogs 3: export"
new_module = "craft_ui::patterns::form_dialogs"

[[type]]
name = "ExportAsDialog"
old = "craft_ui::dialog::export::ExportAsDialog"
new = "craft_ui::patterns::form_dialogs::ExportAsDialog"
status = "moved"
note = "A pattern over `FormDialog<ExportOptions>`: `ExportAsDialog::new(file_name, PixelSize, Bind<ExportOptions>)` with `formats`, `opened`, `defaults`, `preview`, `answers` and `saving`; `show(ui) -> ExportAsOutput`. The dialog is not a `StackDialog` and keeps no picker ticket: Export files a save request (file name and format filter) in `ExportAsOutput::requests`, the app opens its file dialog and answers with the path through `answers`, which closes the dialog with the result. The bind holds the settings (`initial` is the bind's value)."

[[type]]
name = "ExportAsOutput"
old = ""
new = "craft_ui::patterns::form_dialogs::ExportAsOutput"
status = "replaced"
note = "`{ response, closed, result: Option<ExportAsResult>, wanted_preview: Option<PreviewRequest<ExportOptions>>, requests: HostRequests }`. `wanted_preview` replaces `ExportAsDialog::wanted_preview`; the save request carries the file name and format."

[[type]]
name = "ExportFormat"
old = "craft_ui::dialog::export::ExportFormat"
new = "craft_ui::patterns::form_dialogs::ExportFormat"
status = "moved"
note = "Built with `ExportFormat::new(id, name)` and the setters `quality`, `lossless`, `transparency`, `bits` and `max_side`; `standard()` is unchanged."

[[type]]
name = "ExportSize"
old = "craft_ui::dialog::export::ExportSize"
new = "craft_ui::patterns::form_dialogs::ExportSize"
status = "moved"
note = "`Pixels` is built with `ExportSize::pixels(width, height)`."

[[type]]
name = "ExportMetadata"
old = "craft_ui::dialog::export::ExportMetadata"
new = "craft_ui::patterns::form_dialogs::ExportMetadata"
status = "moved"

[[type]]
name = "ExportProfile"
old = "craft_ui::dialog::export::ExportProfile"
new = "craft_ui::patterns::form_dialogs::ExportProfile"
status = "moved"

[[type]]
name = "ExportOptions"
old = "craft_ui::dialog::export::ExportOptions"
new = "craft_ui::patterns::form_dialogs::ExportOptions"
status = "moved"
note = "The `resample` field is the sizing dialogs' `Resample`, shown as a Resample row. `fitted(formats, PixelSize)` is the legacy private `fit`; `output_size(PixelSize)` is the legacy private `output_size`."

[[type]]
name = "SizeEstimate"
old = "craft_ui::dialog::export::SizeEstimate"
new = "craft_ui::patterns::form_dialogs::SizeEstimate"
status = "moved"

[[type]]
name = "ExportFormatDefaults"
old = "craft_ui::dialog::export::ExportFormatDefaults"
new = "craft_ui::patterns::form_dialogs::ExportFormatDefaults"
status = "moved"
note = "Built with `ExportFormatDefaults::default()` and the setters `jpeg_quality`, `webp_quality` and `webp_lossless`."

[[type]]
name = "ExportPreview"
old = "craft_ui::dialog::export::ExportPreview"
new = "craft_ui::patterns::form_dialogs::ExportPreview"
status = "moved"
note = "`ExportPreview::new(revision, PreviewState)` with `.estimate(SizeEstimate)`; the texture is a `PreviewState` (`Pending`, `Ready`, `Failed`). The app gives it back every pass with `ExportAsDialog::preview` instead of `set_preview`; an exact size is the same revision with `SizeEstimate::Exact` (was `set_exact_estimate`)."

[[type]]
name = "ExportAsResult"
old = "craft_ui::dialog::export::ExportAsResult"
new = "craft_ui::patterns::form_dialogs::ExportAsResult"
status = "moved"
note = "`size: PixelSize` replaces `width` and `height`."

[[type]]
name = "ExportAsLabels"
old = "craft_ui::dialog::export::ExportAsLabels"
new = ""
status = "removed"
note = "Replaced by `ExportWords`."

[[type]]
name = "ExportWords"
old = ""
new = "craft_ui::patterns::form_dialogs::ExportWords"
status = "replaced"
note = "The words of Export As (`export.*` ids)."

[[type]]
name = "JpegOptionsDialog"
old = "craft_ui::dialog::export::JpegOptionsDialog"
new = ""
status = "removed"
note = "Replaced by `FormatOptionsDialog::new(ExportOptionsKind::Jpeg)`; JPEG, TIFF, Targa and DDS options are one form over four parameter lists."

[[type]]
name = "TiffOptionsDialog"
old = "craft_ui::dialog::export::TiffOptionsDialog"
new = ""
