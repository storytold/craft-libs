[[type]]
name = "WatermarkEditor"
old = "craft_ui::dialog::export::watermark::WatermarkEditor"
new = ""
status = "removed"
note = "`Watermark::new(label, Bind<WatermarkSettings>)` in `craft_ui::patterns::form_dialogs`, a pattern over `FieldGroup`: `show(ui) -> WatermarkOutput { response, value, requests: HostRequests }`; Position is `ReferencePoint`, size, opacity and insets are `SliderField`s, and the image picker is the `PathRequest` keyed `WATERMARK_IMAGE_KEY` in `requests`."

[[type]]
name = "Watermark"
old = "craft_ui::dialog::export::watermark::Watermark"
new = ""
status = "removed"
note = "The data is `WatermarkSettings`, with `position: Anchor9` (was `Anchor`); `rotation` stays degrees. The name `Watermark` now belongs to the pattern."

[[type]]
name = "WatermarkSettings"
old = ""
new = "craft_ui::patterns::form_dialogs::WatermarkSettings"
status = "replaced"
note = "The watermark's data: style, vertical, position, rotation, size, opacity, inset and shadow; `insets_across()` and `insets_down()` say which insets apply. No serde derive: `Anchor9` has none."

[[type]]
name = "WatermarkStyle"
old = "craft_ui::dialog::export::watermark::WatermarkStyle"
new = "craft_ui::patterns::form_dialogs::WatermarkStyle"
status = "moved"
note = "`#[non_exhaustive]`; `is_graphic()`; no serde derive."

# One entry per renamed, removed or reshaped setter or constructor.

[[setter]]
type = "SaveForWebDialog"
old = "SaveForWebDialog::new(name, width, height, original: TextureHandle)"
new = "SaveForWebDialog::new(name, size: PixelSize, WebPictures)"
note = "The original is `WebPictures::new().original(SizedTexture)`; `HostedSaveForWeb::new(name, size, original)` is the hosted form."

[[setter]]
type = "SaveForWebDialog"
old = "presets(Vec<(String, SaveForWebOptions)>)"
new = "presets(Vec<WebPreset>)"

[[setter]]
type = "SaveForWebDialog"
old = "animation(frames, fps)"
new = "animation(Animation::new(frames, fps))"

[[setter]]
type = "SaveForWebDialog"
old = "wanted_variants() -> Vec<(usize, u64, SaveForWebOptions)>"
new = "SaveForWebOutput::wanted_variants: Vec<WantedVariant>"
note = "`HostedSaveForWeb::wanted_variants()` returns them once."
