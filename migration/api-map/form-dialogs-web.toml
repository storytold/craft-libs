# API map of the "Form dialogs 3: Save for Web" family: old path to new path and setter renames.

family = "Form dialogs 3: Save for Web"
new_module = "craft_ui::patterns::form_dialogs"

[[type]]
name = "SaveForWebDialog"
old = "craft_ui::dialog::export::web::SaveForWebDialog"
new = "craft_ui::patterns::form_dialogs::SaveForWebDialog"
status = "moved"
note = "A pattern on `Dialog` that keeps its state in its root container's slot: a `FormDialog<SaveForWebOptions>`: `SaveForWebDialog::new(name, size: PixelSize, WebPictures, Bind<SaveForWebOptions>)` with `.presets(Vec<WebPreset>)`, `.animation(Animation)`, `.remember(SaveKey)`, `.saving(bool)`, `.answers(Vec<HostAnswer>)` and `.opened(Bind<bool>)`; `show(ui) -> SaveForWebOutput`. The settings the dialog opens with are the bound value; the old `.options` setter is the bind. The old `.matte([u8; 3])` and `.saved_to(PathBuf)` are `HostAnswer::Color` (key `MATTE_COLOR_KEY`) and `HostAnswer::Path` (key `SAVE_PATH_KEY`) in `.answers`. The owned form is `HostedSaveForWeb`, a `StackDialog` with `wanted_variants`, `set_variant`, `set_original`, `frame`, `pick_color`, `pick_path`, `answer_color`, `answer_path`, `cancel_requests`. The old `presets`, `animation`, `wanted_variants`, `set_variant`, `set_original` and `frame` keep their names on `HostedSaveForWeb`; `pick_color` keeps its name; `queue_save` and the picker ticket are `pick_path` and `answer_path`; `set_color` is `answer_color`."

[[type]]
name = "HostedSaveForWeb"
old = ""
new = "craft_ui::patterns::form_dialogs::HostedSaveForWeb"
status = "replaced"
note = "The `StackDialog` form of `SaveForWebDialog`: `HostedSaveForWeb::new(name, size, original: SizedTexture)`; it keeps the settings, drops stale variants, keeps the colour and path requests until taken and finishes with `SaveForWebResult` when `answer_path(key, path)` answers; `cancel_requests()` drops a pending request."

[[type]]
name = "SaveForWebOutput"
old = ""
new = "craft_ui::patterns::form_dialogs::SaveForWebOutput"
status = "replaced"
note = "`SaveForWebOutput { response, closed, result, wanted_variants, requests: HostRequests, options, size, frame, selected }`; the matte colour request and the Save… path request are in `requests`."

[[type]]
name = "SaveForWebOptions"
old = "craft_ui::dialog::export::web::SaveForWebOptions"
new = "craft_ui::patterns::form_dialogs::SaveForWebOptions"
status = "moved"
note = "`#[non_exhaustive]`. The `resample` field is not carried until the sizing dialogs' `Resample` lands at the combined base."

[[type]]
name = "WebFormat"
old = "craft_ui::dialog::export::web::WebFormat"
new = "craft_ui::patterns::form_dialogs::WebFormat"
status = "moved"
note = "`#[non_exhaustive]`; `extension()`, `name()` and `indexed()` are public, `ALL` lists the formats."

[[type]]
name = "ColorTable"
old = "craft_ui::dialog::export::web::ColorTable"
new = "craft_ui::patterns::form_dialogs::ColorTable"
