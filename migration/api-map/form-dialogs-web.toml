[[type]]
name = "WebView"
old = "craft_ui::dialog::export::web::WebView"
new = "craft_ui::patterns::form_dialogs::WebView"
status = "moved"
note = "`#[non_exhaustive]`; `panes()` lists the panes a view shows."

[[type]]
name = "WebVariant"
old = "craft_ui::dialog::export::web::WebVariant"
new = "craft_ui::patterns::form_dialogs::WebVariant"
status = "moved"
note = "`texture: TextureHandle` is `picture: Result<SizedTexture, Label>` (a failed encode is the pane's `Failed` state); built by `WebVariant::new(index, revision, texture, bytes)` or `WebVariant::failed(..)` with `.colors(n)` and `.proxy(bool)`. `palette` is not carried: no swatch component exists to show it."

[[type]]
name = "SaveForWebResult"
old = "craft_ui::dialog::export::web::SaveForWebResult"
new = "craft_ui::patterns::form_dialogs::SaveForWebResult"
status = "moved"
note = "`#[non_exhaustive]`; `remember(&self, ui)` stores the settings and the view for the next open."

