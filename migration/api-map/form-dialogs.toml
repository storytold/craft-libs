# API map of the "Form dialogs" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Form dialogs"
new_module = "craft_ui::patterns::form_dialogs"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "ParamDialog"
old = "craft_ui::dialog::params::ParamDialog"
new = "craft_ui::patterns::form_dialogs::ParamDialog"
status = "moved"
note = "A pattern: `ParamDialog::new(key, title, params)` with `show(ui) -> ParamDialogOutput { response, closed, result, rows, values, preview_on }`. A `DialogHost` owns it as `HostedParamDialog`, whose `build` closure makes the dialog over the host's values each pass."

[[type]]
name = "HostedParamDialog"
old = ""
new = "craft_ui::patterns::form_dialogs::HostedParamDialog"
status = "replaced"
note = "The `StackDialog` form of `ParamDialog`: `HostedParamDialog::new(key, fields, |fields| ParamDialog::new(..).values(Bind::bound(fields)))`, or `HostedParamDialog::command(..)` for a command form, with `fields`, `fields_mut`, `pick_color`, `pick_path`, `pick_eyedropper`, `answer_color`, `answer_path`, `answer_eyedropper` and `cancel_requests` (over an embedded `HostRequests`)."

[[type]]
name = "CommandForm"
old = "craft_ui::dialog::command_form::CommandForm"
new = ""
status = "replaced"
note = "Replaced by the constructor `ParamDialog::command(key, title, params)`: a `ParamDialog` with no `preview` and no `remember` key, with every option of `ParamDialog` (`values`, `opened`, `ok_enabled`, `ok_reason`, `ok_label`, `cancel_label`, `closable`, `outer_gesture`, `footer_extra`, `below`). Hosted, `HostedParamDialog::command(key, fields, build)`."

[[type]]
name = "ParamLayout"
old = "craft_ui::dialog::params::ParamLayout"
new = "craft_ui::patterns::form_dialogs::ParamLayout"
status = "moved"
note = "Variants are `Beside` (was `SideColumn`) and `Below` (was `BottomFooter` and `Stacked`); OK and Cancel are always the dialog's footer (`cancel_label`, `alt_resets`, `outer_gesture`, `collection_body` and `shaped(|dialog| ..)` shape it), and the Preview check box and zoom row sit over the pane."

[[type]]
name = "ParamResult"
old = "craft_ui::dialog::params::ParamResult"
new = "craft_ui::patterns::form_dialogs::ParamResult"
status = "moved"
note = "`key` and `fields` are public fields (`#[non_exhaustive]`); `remember(&self, ui)` stores the values under the dialog's `SaveKey`."

[[type]]
name = "PreviewPane"
old = ""
new = "craft_ui::patterns::form_dialogs::PreviewPane"
status = "replaced"
note = "The preview panes of `ParamDialog` and Save for Web: `PreviewPane::new(label, texture: SizedTexture, view: &PreviewView)` shows the picture; `PreviewPane::state(label, PreviewState, view)` is the second constructor; `.click_centres(bool)` is a builder (fit and the zoom range belong to the `PreviewView`). `show(ui) -> PreviewOutput { response, view: Option<PreviewView>, shown: PreviewView }` reports the next view after a pan, a zoom or a double click (which returns to fit) and the view drawn; a caller keeps `view.unwrap_or(shown)`. The pane declares AccessKit's scroll actions on the axes it pans on (`Access::pans`) and takes the wheel's scroll only on those axes (`Sense::WHEEL_X`, `WHEEL_Y`), always the zoom (`Sense::WHEEL_ZOOM`)."

[[type]]
name = "PreviewView"
old = ""
new = "craft_ui::patterns::form_dialogs::PreviewView"
status = "replaced"
note = "The one value a caller keeps per preview pane and passes to `PreviewPane` and `PreviewZoom`, both of which report the next one: `PreviewView { transform: CanvasTransform, fit: bool, range: RangeInclusive<f32> }`, built by `PreviewView::new(transform)` or `PreviewView::fitting()` and `.zoom_range(range)`."

[[type]]
name = "PreviewState"
old = ""
new = "craft_ui::patterns::form_dialogs::PreviewState"
status = "replaced"
note = "What a `PreviewPane` shows: `Pending(Option<f32>)` (the checker well with a progress line), `Ready(SizedTexture)` and `Failed(Label)` (a message line). The host encodes the preview; the dialog only shows these three."

[[type]]
name = "HostRequests"
old = ""
new = "craft_ui::patterns::form_dialogs::HostRequests"
status = "replaced"
note = "The colour, path and eyedropper requests of hosted rows, kept until the host takes them: `absorb(&mut ParamRowsOutput)`, `request_color(ColorRequest)`, `request_path(PathRequest)`, `request_eyedropper(EyedropperRequest)`, `take_color`, `take_path`, `take_eyedropper`, `cancel`. `HostedParamDialog` embeds it."

[[type]]
name = "ResetFooter"
old = ""
new = "craft_ui::patterns::form_dialogs::ResetFooter"
status = "replaced"
note = "The footer whose Cancel turns into Reset while Alt is held, shared by `ParamDialog` and other dialogs: `ResetFooter::new(ui, cancel_label, alt_resets)`, `buttons(accept, changed) -> [FooterButton; 2]` for `Dialog::buttons` (Reset is role `Other` and stays open), and `pick(DialogOutput::picked) -> Option<ResetPick>`. The restore of the values is `ParamDialog`'s own; a `LinkedSize` dialog resets through `LinkedSize::reset`."

[[type]]
name = "ResetPick"
old = ""
new = "craft_ui::patterns::form_dialogs::ResetPick"
status = "replaced"
note = "What `ResetFooter::pick` answers with: `Accept`, `Reset` or `Cancel`."

[[type]]
name = "PreviewZoom"
old = ""
new = "craft_ui::patterns::form_dialogs::PreviewZoom"
status = "replaced"
note = "The zoom-out and zoom-in buttons with the zoom percentage over the same `PreviewView` as `PreviewPane`: `PreviewZoom::new(&view)`; the buttons stay inside the view's zoom range and `show(ui)` reports `PreviewZoomOutput { response, view: Option<PreviewView> }`."


# Parameter model and rows (form-dialogs-a).
