new = "craft_ui::runtime::requests::PathKind"
status = "moved"

[[type]]
name = "PathFilter"
old = ""
new = "craft_ui::runtime::requests::PathFilter"
status = "replaced"
note = "Moved with `PathRequest` to the host-services layer (`runtime::requests`); `IMAGE_EXTENSIONS` (the picture extensions a file dialog offers) sits beside `PathKind`."

[[type]]
name = "HostAnswer"
old = ""
new = "craft_ui::runtime::requests::HostAnswer"
status = "replaced"
note = "What the host answered to a colour, path or eyedropper request; defined with the requests in `runtime::requests`, and `HostRequests` (still in `patterns::form_dialogs`) keeps them."

[[type]]
name = "PathRequest"
old = "craft_ui::dialog::params::PathRequest"
new = "craft_ui::runtime::requests::PathRequest"
status = "moved"
note = "`#[non_exhaustive]`: build with `PathRequest::new(key, kind)`."

[[type]]
name = "EyedropperRequest"
old = "craft_ui::dialog::params::EyedropperRequest"
new = "craft_ui::runtime::requests::EyedropperRequest"
status = "moved"
note = "`#[non_exhaustive]`: build with `EyedropperRequest::new(key)`; it names the key the host answers and has no `armed` field (the sampler registration owns that)."

[[type]]
name = "CustomRow"
old = "craft_ui::dialog::params::CustomRow"
new = "craft_ui::patterns::form_dialogs::CustomRow"
status = "moved"
note = "The draw closure takes `&mut CustomContext` in place of `&CustomContext`."

[[type]]
name = "CustomContext"
old = "craft_ui::dialog::params::CustomContext"
new = "craft_ui::patterns::form_dialogs::CustomContext"
status = "moved"
note = "`pick_color(&mut self, key)` records the request, which comes back as `ParamRowsOutput::pick_color`; it no longer goes through egui temp data."

[[type]]
name = "ParamRowsResponse"
old = "craft_ui::dialog::params::ParamRowsResponse"
new = ""
status = "removed"
note = "Replaced by `ParamRowsOutput { response, changed, values, pick_color, path, eyedropper }`; `color` is `pick_color`."

[[type]]
name = "ParamRowsOutput"
old = ""
new = "craft_ui::patterns::form_dialogs::ParamRowsOutput"
status = "replaced"
note = "The output of `ParamRows::show`, in place of `ParamRowsResponse`; `values` holds the values after the pass for a binding that does not write through."

[[type]]
name = "ParamRows"
old = "craft_ui::dialog::params::ParamRows"
new = "craft_ui::patterns::form_dialogs::ParamRows"
status = "moved"
note = "A pattern on `FieldGroup`: `ParamRows::new(label, &params, Bind<DialogFields>)` in place of `new(id_salt, &params)` with `show(ui, &mut fields)`; `show(ui)` returns `ParamRowsOutput`. A `Param::section` opens a `Section` whose body is the rows up to the next section. `.read_only(true)` shows the values and refuses edits."

[[type]]
name = "DialogFields"
old = "craft_ui::dialog::fields::DialogFields"
new = "craft_ui::patterns::form_dialogs::DialogFields"
status = "moved"

[[type]]
name = "FieldValue"
old = "craft_ui::dialog::fields::FieldValue"
new = "craft_ui::patterns::form_dialogs::FieldValue"
status = "moved"

[[type]]
name = "ColorRequest"
old = "craft_ui::dialog::color_request::ColorRequest"
new = "craft_ui::runtime::requests::ColorRequest"
status = "moved"
note = "`title` is an `Option<Label>`; `#[non_exhaustive]`, build with `ColorRequest::new(key, color)`."

