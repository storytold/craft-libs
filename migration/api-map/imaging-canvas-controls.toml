# API map of the "imaging canvas controls" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "imaging canvas controls"
new_module = ""

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "WarpGrid"
old = ""
new = ""
status = "pending"

[[type]]
name = "PinWarp"
old = ""
new = ""
status = "pending"

[[type]]
name = "PerspectiveWarp"
old = ""
new = ""
status = "pending"

[[type]]
name = "SelectionOverlay"
old = ""
new = ""
status = "pending"

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

