old = "craft_imaging::ui::transform_preview::TextureChoice"
new = "craft_imaging::ui::transform_preview::TextureChoice"
status = "same"

[[type]]
name = "StylePlan"
old = "craft_imaging::ui::transform_preview::StylePlan"
new = "craft_imaging::ui::transform_preview::StylePlan"
