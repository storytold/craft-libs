old = ""
new = "craft_imaging::ui::transform_preview::PreviewMesh"
status = "replaced"
note = "The mesh a map draws, in document units: `PreviewMap::build` and `PreviewMesh::clipped` are public so the maps can be checked."

[[type]]
name = "StyledFrame"
old = ""
new = "craft_imaging::ui::transform_preview::StyledFrame"
status = "replaced"
note = "What a styled composite is made from in one pass: `StyledFrame::new(textures, quad, canvas, zoom)`."

[[type]]
