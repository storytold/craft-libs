# API map of the "Imaging: transform preview, blur pins" family: old path to new path and setter renames.

family = "Imaging: transform preview, blur pins"
new_module = "craft_imaging::ui"

[[type]]
name = "PreviewMap"
old = "craft_imaging::ui::transform_preview::PreviewMap"
new = "craft_imaging::ui::transform_preview::PreviewMap"
status = "same"

[[type]]
name = "PreviewQuality"
old = "craft_imaging::ui::transform_preview::PreviewQuality"
new = "craft_imaging::ui::transform_preview::PreviewQuality"
status = "same"

[[type]]
name = "PreviewTextures"
old = "craft_imaging::ui::transform_preview::PreviewTextures"
new = "craft_imaging::ui::transform_preview::PreviewTextures"
status = "same"
note = "`PreviewTextures::new(name, pixels)` takes no `Context`; the uploads go through the texture store when the preview is painted. `pick` takes the context and is public."

[[type]]
name = "StyledPreview"
old = "craft_imaging::ui::transform_preview::StyledPreview"
new = "craft_imaging::ui::transform_preview::StyledPreview"
status = "same"
note = "`StyledPreview::texture` is `composite`; the composite is a texture store entry under the preview's name."

[[type]]
name = "TransformPreview"
old = "craft_imaging::ui::transform_preview::TransformPreview"
new = "craft_imaging::ui::transform_preview::TransformPreview"
status = "same"
note = "A paint-only canvas control: `TransformPreview::new(label, &textures)` shown with `show_at(ui, canvas_rect)` in the canvas body under the guides and the box; its view is the canvas's. `above` is removed: show a `RasterDisplay` of the layers above right after it."

[[type]]
name = "PreviewPixels"
old = "craft_imaging::ui::transform_preview::PreviewPixels"
new = "craft_imaging::ui::transform_preview::PreviewPixels"
status = "same"

[[type]]
