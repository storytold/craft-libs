[[type]]
name = "BlendRowsWords"
old = ""
new = "craft_layers::ui::rows::BlendRowsWords"
status = "replaced"
note = "The words of the blend, opacity, lock and fill rows; ids `blendRows.*` (legacy `layers.blendMode`, `layers.opacity`, `layers.fill`, `layers.lock`, `layers.lock*`). The Opacity, Fill and Lock captions carry no colon."

