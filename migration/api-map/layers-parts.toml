[[setter]]
type = "BlendRows"
old = "new(id_salt, properties, blend_modes)"
new = "new(properties, blend_modes)"
note = "`blend_modes` is `&[Entry<String>]`; the id salt is gone."

[[setter]]
type = "BlendRows"
old = "labels(BlendRowsLabels)"
new = ""
note = "Words are the installed `BlendRowsWords`."

[[setter]]
type = "BlendRows"
old = "locks(bool)"
new = "locks(bool)"

[[setter]]
type = "LayerFilterBar"
old = "new(id_salt, &mut LayerFilter)"
new = "new(Bind<LayerFilter>)"
note = "`Bind::bound(&mut filter)` writes through; `LayerFilterOutput::edit` carries the change for a given value."

[[setter]]
type = "LayerFilterBar"
old = "blend_modes(&[BlendChoice])"
new = "blend_modes(&[Entry<String>])"

[[setter]]
type = "LayerFilterBar"
old = "labels(LayerFilterLabels)"
new = ""
note = "Words are the installed `LayerFilterWords`."

[[setter]]
type = "LayersOptionsDialog"
old = "new()"
new = "new(LayersOptions)"

[[setter]]
type = "LayersOptionsDialog"
old = "initial(LayersOptions)"
new = ""
note = "Pass the options to `new`."

[[setter]]
type = "LayerTree"
old = "accepts_drop(&Move<LayerRowKey<Id>>, Modifiers)"
new = "accepts_drop(&ReorderMove<LayerRowKey<Id>>, Mods)"
note = "`Mods` is `craft_keymap::Mods`; `ReorderMove` is `craft_ui::contract::ReorderMove`."

[[call]]
old = "LayersOptionsDialog::new().initial(options)"
new = "LayersOptionsDialog::new(options)"
note = "The dialog takes the options it opens with."
