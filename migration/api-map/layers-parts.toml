# API map of the "Layers parts" family: old path to new path and setter renames.
# Covers the tree data, the blend rows, the filter bar, the options dialog and the thumbnail key of craft-layers.

family = "Layers parts"
new_module = "craft_layers::ui"

[[type]]
name = "LayerTree"
old = "craft_layers::ui::tree::LayerTree"
new = "craft_layers::ui::tree::LayerTree"
status = "same"
note = "`blend_modes` returns `Vec<Entry<String>>` and `accepts_drop` takes `&ReorderMove<LayerRowKey<Id>>` and `craft_keymap::Mods`."

