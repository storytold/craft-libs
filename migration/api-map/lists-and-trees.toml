new = ""
status = "removed"
note = "Drag ghosts and drop marks are behaviour of the item step and the drag session."

[[type]]
name = "drop_line"
old = "craft_ui::list::drop_line"
new = ""
status = "removed"
note = "Drag ghosts and drop marks are behaviour of the item step and the drag session."

[[type]]
name = "paint_drop_mark"
old = "craft_ui::list::paint_drop_mark"
new = ""
status = "removed"
note = "Drag ghosts and drop marks are behaviour of the item step and the drag session."

[[type]]
name = "GhostThumb"
old = "craft_ui::list::GhostThumb"
new = ""
status = "removed"
note = "Drag ghosts and drop marks are behaviour of the item step and the drag session."

[[type]]
name = "RowCommand"
old = "craft_ui::list::RowCommand"
new = ""
status = "removed"
note = "The row's menu is the app's (`CollectionEvent::ContextMenu`); a rename ends in `CollectionEvent::Rename(EditEvent<Rename>)` with `Commit` or `Cancel`."

[[type]]
name = "RowMenuLabels"
old = "craft_ui::list::RowMenuLabels"
new = ""
status = "removed"
note = "The row's menu is the app's (`CollectionEvent::ContextMenu`); a rename ends in `CollectionEvent::Rename(EditEvent<Rename>)` with `Commit` or `Cancel`."

[[type]]
name = "RenameEnd"
old = "craft_ui::list::RenameEnd"
new = ""
status = "removed"
note = "The row's menu is the app's (`CollectionEvent::ContextMenu`); a rename ends in `CollectionEvent::Rename(EditEvent<Rename>)` with `Commit` or `Cancel`."

[[type]]
name = "TrailingItem"
old = "craft_ui::list::row::TrailingItem"
new = ""
status = "replaced"
note = "A trailing item is a caption-role text as wide as it measures: `ListRow::trailing(text)` and `ListRow::optional(text)`; the optional one drops out when the label would get narrower than its least width. `TrailingPaint` is removed."

[[type]]
name = "TreeState"
old = "craft_ui::list::tree::TreeState"
new = ""
status = "replaced"
note = "Plain app data (`OpenSet<K>`, no egui memory): the app keeps it and reports `ItemSource::open` from it. `apply(key, open, all, groups)` takes the parts of `RowEvent::Open` and `CollectionEvent::Open`."

[[type]]
name = "OpenChange"
old = "craft_ui::list::tree::OpenChange"
new = "craft_ui::contract::OpenChange"
status = "moved"
note = "`OpenChange { key, open }`: no `all` field (see the report)."

[[type]]
name = "TreeText"
old = "craft_ui::list::tree::TreeText"
new = ""
status = "replaced"
note = "`ListWords::expand` and `collapse`, built-in words with `{row}`."

[[type]]
name = "paint_disclosure"
old = "craft_ui::list::paint_disclosure"
new = ""
status = "replaced"
note = "A row's disclosure part is a `Disclosure` face."

[[type]]
name = "TreeRow"
old = "craft_ui::list::tree::TreeRow"
new = ""
status = "replaced"
note = "`TreeRow::new(row, depth, has_children, open)` is `row.depth(depth)` plus `.group(open)` for a row that has children: one component, no wrapper. `TreeRow::text` is `ListWords`; `into_row` and `show` are gone."

[[type]]
name = "UndoRowEvent"
old = "craft_ui::list::UndoRowEvent"
new = ""
status = "removed"
note = "An undo row reports nothing of its own: a press on the row is `CollectionEvent::Activate`, which `undo_count(&events)` reads."

[[type]]
name = "UndoRowOutput"
old = "craft_ui::list::UndoRowOutput"
new = ""
status = "removed"
note = "See `UndoRowEvent`."

[[type]]
name = "UndoRow"
old = "craft_ui::list::UndoRow"
new = ""
status = "removed"
note = "An undo list shows `ListRow`s: `UndoRows::row(at)` is `ListRow::new(label).option()`, the option role of a listbox. The list's selection marks the rows."

[[type]]
name = "UndoRowStyle"
old = "craft_ui::list::UndoRowStyle"
new = ""
status = "removed"
note = "See `UndoRow`; the look is `ListRowStyle`."

[[type]]
name = "FindingsList"
old = "craft_ui::list::findings::FindingsList"
new = "craft_ui::list::FindingsList"
status = "moved"
note = "A `Collection`: `FindingsList::new(label).show_items(ui, &Findings::new(&findings), &mut |key, icx| findings[*key].row(&icx.words::<FindingsWords>()))`. `FindingLevel` is `Severity` (with `Info`), `Finding::message` is `text`, `Finding::page` is `detail` (the app writes the words), `Finding::target` stays in the app (filter `Activate` events by it). The list is keyed by `Finding::id` (`Finding::new(id, severity, text)`), so the selection survives findings that come and go. The summary line is `FindingsSummary::new(&findings)`; `findings_summary(ctx, findings, labels)` is `summary_text(&FindingsWords, findings)`."

[[type]]
name = "EventLog"
old = "craft_ui::list::events::EventLog"
new = "craft_ui::list::EventLog"
status = "replaced"
note = "`EventLog` is the item source (events at or above `EventLogState::min_level`, newest first, keyed by event id) shown by `EventList`, which is striped, with `LogEvent::row(age, words, icx.row.striped)`. The bar (level select, counts, Clear All) and the details box are not ported: they need `Button`, `Select`, `Notice` and a `Pattern` type that this revision lacks. `EventLogState::selected` is the app's `Selection<u64>`; `EventLogOutput::clear_all` goes with the bar. `EventLogLabels` is `EventWords`."

[[type]]
name = "UndoList"
old = "craft_ui::edit::history_panel::undo_list::UndoList"
new = "craft_ui::list::UndoList"
status = "replaced"
note = "A `Collection` over `UndoRows::new(&labels)` (labels newest first, built by the app from its history) with a `UndoMark` selection; `undo_count(&events)` is `UndoListEvent::UndoThrough(n)`, `footer_text(&UndoWords, &format, &mark)` is the footer text (the count in the scope's digits) (`None` is the Cancel row). `UndoList::marked(Some(i))` is `Bind::given(UndoMark::at(i))`. Hover marking and the footer row are not ported."

