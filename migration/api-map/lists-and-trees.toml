# API map of the "Lists and trees" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Lists and trees"
new_module = "craft_ui::list"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "List"
old = "craft_ui::list::view::List"
new = "craft_ui::list::List"
status = "moved"
note = "A generic `Collection` component `List<K>`: `List::new(label)` then `.show_items(ui, &source, &mut |key, icx| ListRow::new(..))`. The rows are a `DisplayOrder` plus `ItemSource` (`size_hint` gives a row's height, `Auto` rows measure themselves); the output is `CollectionResponse<K, RowEvent>` whose events replace `ListEvent`. `ListOutput::rows` and `drop_target` have no counterpart (the item step draws the drop mark)."

[[type]]
name = "ListRow"
old = "craft_ui::list::row::ListRow"
new = "craft_ui::list::ListRow"
status = "moved"
note = "The item component of a `List`: `ListRow::new(label)` (no key; the item step names the row) built in the `show_items` closure from the `ItemCx`: `.cells(icx.cells())` for toggle cells, `.renaming(icx.row.renaming)`, `.depth(icx.depth)`. It is a leaf `Component`: `show` is the pipeline's and the output is `RowOutput { response, event, label }`. Selection, focus, the lead, hover, the drop mark, the drag ghost, the row menu, rename keys and double-click rename belong to the collection."

[[type]]
name = "ToggleColumn"
old = "craft_ui::list::toggle::ToggleColumn"
new = ""
status = "replaced"
note = "The column is the collection's (`ColumnSpec::new(key, header, width).kind(ColumnKind::Toggle(ToggleColumn::sweepable()))`, `craft_ui::contract::ToggleColumn`), which flips cells and sweeps; the source reports each cell with `ItemSource::toggled`. A row draws its cell with `ListRow::toggle(ToggleCell::eye(column, on))`, `ToggleCell::lock`, `ToggleCell::check` or `ToggleCell::new(column, ToggleFace::Icons { on, off }, state, name)`. The sweep, its edit gesture and `CollectionEvent::Toggle(EditEvent<ToggleEdit>)` replace `RowEvent::Toggle`."

[[type]]
name = "ToggleEdit"
old = "craft_ui::list::toggle::ToggleEdit"
new = "craft_ui::contract::ToggleEdit"
status = "moved"
note = "`ToggleEdit { key, column: ColumnKey, on }`: the column is a key, not an index, and the row is `key`."

[[type]]
name = "RowResponse"
old = "craft_ui::list::row::RowResponse"
new = ""
status = "replaced"
note = "`RowOutput { response, event, label }`. The `toggles` responses, `events` list and `min_width` are gone: toggles report through the collection, a row reports one `RowEvent` per pass, and `ListRow::measure_in(ui, Proposal::Min)` gives the least width."

[[type]]
name = "RowEvent"
old = "craft_ui::list::row::RowEvent"
new = "craft_ui::list::RowEvent"
status = "replaced"
note = "Only what a row's own parts report remains: `Open { open, all }` (`all` while Alt is held), `LinkToggled { thumb, linked }`, `ThumbClicked { target: ThumbTarget, mods: Mods, clicks: u32 }` (was a tuple variant; `mods` are the modifiers held at the click, none for a key; `clicks` is the press count, 1 for a key), `ThumbDrag(ThumbTarget)`, and `Trailing { part: TrailingPart, mods: Mods }` for a press on a trailing part (`ListRow::trailing_part`). `Toggle`, `Renamed`, `RenameStarted`, `RenameEnded`, `Menu` and `LabelDoubleClicked` are `CollectionEvent::Toggle`, `CollectionEvent::Rename`, `CollectionEvent::ContextMenu` and `CollectionEvent::Activate`."

[[type]]
name = "ThumbSize"
old = "craft_ui::list::row::ThumbSize"
new = "craft_ui::list::ThumbSize"
status = "moved"
note = "`ThumbSize::label(&ListWords)` is the name in the user's language; `name()` and `ThumbSizeLabels` are gone."

[[type]]
name = "ThumbTarget"
old = "craft_ui::list::row::ThumbTarget"
new = "craft_ui::list::ThumbTarget"
status = "moved"

[[type]]
name = "ListRowStyle"
old = "craft_ui::list::row::ListRowStyle"
new = "craft_ui::list::ListRowStyle"
status = "replaced"
note = "A `ComponentStyle` built from the tokens; its fields are private. `ListRow::row_height(cx, thumb, detail)` is `ListRowStyle::height(thumb, detail)` for an item layout."

[[type]]
name = "DropMark"
old = "craft_ui::list::row::DropMark"
new = "craft_ui::contract::DropMark"
status = "replaced"
note = "The item step draws the drop mark of a row and the insertion line; `ListRow::drop_mark` is gone."

[[type]]
name = "paint_ghost"
