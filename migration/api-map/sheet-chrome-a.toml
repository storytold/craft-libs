# API map of the "Sheet: field list, conditions, filter, slicer, reference picker" family: old path to new path and setter renames.

family = "Sheet: field list, conditions, filter, slicer, reference picker"
new_module = "craft_table::ui"

[[type]]
name = "FieldListPane"
old = "craft_table::ui::fields::FieldListPane"
new = "craft_table::ui::fields::FieldListPane"
status = "replaced"
note = "A pattern over `Panel` and `Section`s of `List`s: `FieldListPane::new(&[PivotField], &[(FieldArea, Vec<String>)])` and `.values_row(..)`, shown with `show(ui) -> FieldListPaneOutput`; the id salt and `.labels(..)` go (the pane takes its id from its place, words from `FieldListWords`). The checklist is a `List` with a check toggle column, the areas are `List`s with a reorder rule."

[[type]]
name = "FieldListPaneOutput"
old = "craft_table::ui::fields::FieldListPaneOutput"
new = "craft_table::ui::fields::FieldListPaneOutput"
status = "same"

[[type]]
name = "FieldListLabels"
old = "craft_table::ui::fields::FieldListLabels"
new = ""
status = "removed"
note = "Replaced by `FieldListWords`; the ids stay (`fieldList.*`), and `fieldList.moveTo` is a template word."

[[type]]
name = "FieldListWords"
old = ""
new = "craft_table::ui::fields::FieldListWords"
status = "replaced"
note = "The `words!` set of the pane; read through `Env::words`."

[[type]]
name = "FieldArea"
old = "craft_table::ui::fields::FieldArea"
new = "craft_table::ui::fields::FieldArea"
status = "same"

[[type]]
name = "PivotField"
old = "craft_table::ui::fields::PivotField"
new = "craft_table::ui::fields::PivotField"
status = "replaced"
note = "`#[non_exhaustive]`: build with `PivotField::new(name, numeric)` and `.samples(..)`."

[[type]]
name = "ValuesRow"
old = "craft_table::ui::fields::ValuesRow"
new = "craft_table::ui::fields::ValuesRow"
status = "replaced"
note = "`#[non_exhaustive]`: build with `ValuesRow::new(area, at)`."

[[type]]
name = "Summary"
old = "craft_table::ui::fields::Summary"
new = "craft_table::ui::fields::Summary"
status = "same"

[[type]]
name = "ShowAs"
old = "craft_table::ui::fields::ShowAs"
new = "craft_table::ui::fields::ShowAs"
status = "same"

[[type]]
name = "ValueSetting"
old = "craft_table::ui::fields::ValueSetting"
new = "craft_table::ui::fields::ValueSetting"
status = "same"

[[type]]
name = "FieldSort"
old = "craft_table::ui::fields::FieldSort"
new = "craft_table::ui::fields::FieldSort"
status = "same"

[[type]]
name = "FieldGroup"
old = "craft_table::ui::fields::FieldGroup"
new = "craft_table::ui::fields::FieldGroup"
status = "same"

[[type]]
name = "ReportLayout"
old = "craft_table::ui::fields::ReportLayout"
new = "craft_table::ui::fields::ReportLayout"
status = "same"

[[type]]
name = "FieldMove"
old = ""
new = "craft_table::ui::fields::FieldMove"
status = "replaced"
note = "The payload of `FieldListEdit::Move`: the moved fields and the place of the first one among the area's fields. It replaces the kernel's `Move<String>` with its target and drop position."

[[type]]
name = "FieldListEdit"
old = "craft_table::ui::fields::FieldListEdit"
new = "craft_table::ui::fields::FieldListEdit"
status = "replaced"
note = "`Move` carries `EditEvent<FieldMove>` in place of `EditEvent<Move<String>>`; a tick reports `Add` and `Remove` once per row, and Delete on a list row reports `Remove` with the area."

[[type]]
name = "ConditionBuilder"
old = "craft_table::ui::conditions::ConditionBuilder"
new = "craft_table::ui::conditions::ConditionBuilder"
status = "replaced"
note = "A pattern over `Row`s and `Stack`s of the built controls: `ConditionBuilder::new(label, Bind<ConditionGroup>, &dyn ConditionFields)`, shown with `show(ui) -> ConditionBuilderOutput`. The group is edited through the binding as one edit a pass; the id salt, `&mut ConditionGroup` and `.labels(..)` go."

[[type]]
name = "ConditionBuilderOutput"
old = ""
new = "craft_table::ui::conditions::ConditionBuilderOutput"
status = "replaced"
note = "`{ response, changed }`; it is an `Outcome`. The legacy `show` returned a `Response` marked changed."

