# API map of the "Text and number fields" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Text and number fields"
new_module = "craft_ui::text"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "TextField"
old = "craft_ui::controls::text_field::TextField"
new = "craft_ui::text::TextField"
status = "moved"
note = "Generic over a `Codec` (`TextField::with_codec`); `TextField::new(label, Bind<String>)` is the plain field. The value is a `Bind`, not `&str`; the id salt is `.id_salt(..)`."

[[type]]
name = "SearchField"
old = "craft_ui::controls::text_field::SearchField"
new = ""
status = "replaced"
note = "`TextField::search(label, Bind<String>)`: a leading search glyph, a clear part while there is text, Escape clears the text and commits the empty value. The clear button's name is the library word `textField.clear`, not an argument."

[[type]]
name = "TextFieldOutput"
old = "craft_ui::controls::text_field::TextFieldOutput"
new = ""
status = "replaced"
note = "`TextField` shows to `EditResponse<String>`: `submitted`, `escaped` and the edit events are fields of it."

[[type]]
name = "TextFieldStyle"
old = "craft_ui::controls::text_field::TextFieldStyle"
new = ""
status = "replaced"
note = "Read-only style struct; the field look is `craft_ui::text::FieldStyle`, resolved from the tokens. A field's look is a custom variant."

[[type]]
name = "field_box"
old = "craft_ui::controls::text_field::field_box"
new = ""
status = "removed"
note = "The box is the component's surface; a widget that wants a field look shows a `TextField` or reuses `FieldStyle`."

[[type]]
name = "AltTextField"
old = "craft_ui::controls::alt_text::AltTextField"
new = "craft_ui::text::AltTextField"
status = "moved"
note = "A `Component` with a text part (the description box) and a faced check part, shown with `Show::show`; `AltTextField::new(label, Bind::bound(&mut alt))` replaces `new(id_salt, &mut alt)`. The label is the prompt that names the box, so `AltTextLabels::prompt` is the label and `AltTextLabels::alt_text`, `decorative` and `mixed` are the built-in `AltTextWords`. The output is `EditResponse<AltText>`; the whole `AltText` is the value, so the text and the flag arrive in one event. A mixed selection is `Bind::bound_mixed`, not `.mixed(bool)`; `enabled(bool)` is the `Props::enabled` setter; `labels(..)` is a words overlay of the scope; `style(tokens)` and `AltTextStyle` are gone."

[[type]]
name = "NumberField"
old = "craft_ui::controls::number_field::NumberField"
new = "craft_ui::text::NumberField"
status = "moved"
note = "A `Component`: `NumberField::new(label, Bind<Option<f64>>)`; the locale's digits, separators and units are the `NumberCodec` given to `.codec(..)`, and a blank field is `None`. `craft_ui::localized::NumberField` (deprecated) has the same replacement: its `LocaleNumbers` become a `NumberCodec` over a `quantity::Reader`. `show_full`, `show_optional` and `show_optional_full` are `show`; its `NumberOutput` is the edit response (through `Deref`) and `preset` and `typed_unit: Option<UnitKind>` (the unit the committed text named, `50 mm`, in the pass it commits; the value stays in the stored unit). The value type is `NumberValue` (default `Option<f64>`): `NumberField::named(label, Bind<V>)` over `text::NamedOr<K>` (`Named(K)` or `Number(f64)`, `K: NumberName` tied to the `NumberPick::Choice` ids of `.presets(..)`) holds a name from the dropdown or a typed number, and typing a name's label reads as that name."

[[type]]
name = "ChipField"
old = "craft_ui::controls::chips::ChipField"
new = "craft_ui::text::ChipField"
status = "replaced"
note = "A `Component` over `Bind<Vec<String>>`: the value is the list of chip texts, with a draft text part after the chips. `ChipField::new(label, Bind::bound(&mut keywords))` replaces `new(id_salt, label, &chips)`; the host no longer maps `removed` to its own list, because adds and removes arrive as edit events of the value. The remove part is an `IconButton` face and the chip body a `Badge` face. Not ported: `max_lines` and the +N more menu, `clear_all`, per-chip `partial`, `full_name` and `removable`, `clicked`, `context_menu`, `cleared`, `ChipFieldLabels` (the remove word is `ChipWords::remove`), `size(..)` (the scope's control size) and `enabled(..)` (`Props::enabled`)."

[[type]]
name = "LinkedFields"
old = "craft_ui::controls::linked::LinkedFields"
new = "craft_ui::text::LinkedFields"
status = "moved"
note = "A `Component` over one `Bind<[Option<f64>; N]>` and a link `Bind<bool>`; the output is `LinkedOutput` (the values' `EditResponse` and the link's event). Captions are `.captions([..])`, ranges `.range(..)` and `.ranges([..])`, the link kind `.mode(LinkMode)`, the arrangement `.layout(LinkedLayout)`. Decimals and units are the `NumberField` codec's. `show_cells` and `LinkedSlot` are gone: place the fields yourself with `NumberField` and `link_toggle`."

[[type]]
name = "ApplyRow"
old = "craft_ui::controls::mixed::ApplyRow"
new = ""
status = "removed"
note = "Replaced by `sections::GroupBox::apply`, a container: `GroupBox::apply(label, Bind<bool>).show(ui, |ui, _| field)`, a `GroupBox` configuration with no frame and an inline gate header. The check box is in the header and the body is enabled while `apply` is on. The field binds a `Mixed<T>` itself."

[[type]]
name = "NumberFieldOutput"
old = "craft_ui::controls::number_field::NumberFieldOutput"
new = ""
status = "removed"
note = "Replaced by `NumberOutput`."

[[type]]
name = "NumberOutput"
old = ""
new = "craft_ui::text::NumberOutput"
status = "replaced"
note = "The edit response of the value is `.edit` (and derefs); `preset` is the `NumberPick` of a picked row: `Number(f64)` or `Choice(u32)`."

[[type]]
name = "Preset"
old = "craft_ui::controls::number_field::Preset"
new = ""
status = "removed"
note = "Replaced by `craft_ui::contract::Entry<NumberPick>`: `Entry::new(NumberPick::Number(n), label)`, `Entry::new(NumberPick::Choice(id), label).checked(bool)` and `Entry::separator()`; labels are `Label`s. The rows go to `NumberField::presets(&[Entry<NumberPick>])`."

[[type]]
name = "PresetSource"
old = "craft_ui::controls::number_field::PresetSource"
new = ""
status = "removed"
note = "Private in legacy; the three preset builders it served (`presets(&[(label, value)])`, `preset_rows`, `preset_list`) are one `presets(&[Entry<NumberPick>])`."

[[type]]
name = "FieldRule"
old = "craft_ui::controls::number_field::FieldRule"
new = ""
status = "removed"
note = "The field applies its range and step itself. A composite that replayed `apply` with a rule shows a `NumberField` per value instead."

[[type]]
name = "LocalizedDragValue"
old = "craft_ui::localized::LocalizedDragValue"
new = ""
status = "replaced"
note = "Deprecated drag value; use `NumberField::new(label, bind).scrub_by_label()` with a `NumberCodec` for the locale."

# One entry per renamed, removed or reshaped setter or constructor.

[[type]]
name = "AltText"
old = "craft_ui::controls::alt_text::AltText"
new = "craft_ui::text::AltText"
status = "moved"
note = "`#[non_exhaustive]`: build it with `AltText::new(text)` and `.decorative(bool)`. `starts_decorative(flags)` is `AltText::starts_decorative(flags)`."

[[type]]
name = "starts_decorative"
old = "craft_ui::controls::alt_text::starts_decorative"
new = ""
status = "replaced"
note = "Use the associated function `AltText::starts_decorative`."

[[type]]
name = "Chip"
old = "craft_ui::controls::chips::Chip"
new = ""
status = "removed"
note = "A chip is its text, an entry of the field's `Vec<String>`. Keywords that only some of a selection have, a shortened label with a full name and a chip with no remove part have no counterpart."

[[type]]
name = "ChipFieldResponse"
old = "craft_ui::controls::chips::ChipFieldResponse"
new = ""
status = "replaced"
note = "`ChipField` returns `EditResponse<Vec<String>>`: `removed` and a typed add are the new list in the response's event. `clicked`, `context_menu` and `cleared` are not reported."

[[type]]
name = "chip_lines"
old = "craft_ui::controls::chips::chip_lines"
new = ""
status = "removed"
note = "The field flows its own chips; a host that laid chips out itself places chip rows with `Flow`."

