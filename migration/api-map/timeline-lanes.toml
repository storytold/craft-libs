# API map of the "Timeline: lanes and markers" family: old path to new path and setter renames.

family = "Timeline: lanes and markers"
new_module = "craft_timeline::ui"

[[type]]
name = "ClipLane"
old = "craft_timeline::ui::clips::ClipLane"
new = "craft_timeline::ui::clips::ClipLane"
status = "same"
note = "The lane helper of `TrackRow`: `ClipLane::new(clips)` with `tool`, `no_modifier_trims`, `snap`, `locked`, `selection`, `track_label`, `content`; `parts`, `update`, `paint` and `access` take the row's context, the `TimeAxis` and a `ClipLook`. Its drags are the host's gesture of `ClipEdit`; clicks, opens and menus come back as `ClipLaneEvents`."

[[type]]
name = "ClipLaneResponse"
old = "craft_timeline::ui::clips::ClipLaneResponse"
new = ""
status = "removed"
note = "Lane helper of `TrackRow`; events through `ClipLaneEvents` and the row's `ClipEdit` gesture."

[[type]]
name = "ClipPainter"
old = "craft_timeline::ui::clips::ClipPainter"
new = ""
status = "removed"
note = "`ClipContent`: a named closure over the content-paint kit."

[[type]]
name = "TimelineTool"
old = "craft_timeline::ui::clips::TimelineTool"
new = "craft_timeline::ui::clips::TimelineTool"
status = "same"

[[type]]
name = "ThumbnailMode"
old = "craft_timeline::ui::clips::ThumbnailMode"
new = "craft_timeline::ui::clips::ThumbnailMode"
status = "same"

[[type]]
name = "thumbnail_tiles"
old = "craft_timeline::ui::clips::thumbnail_tiles"
new = "craft_timeline::ui::clips::thumbnail_tiles"
status = "same"

[[type]]
name = "KeyframeLane"
old = "craft_timeline::ui::keyframes::KeyframeLane"
new = "craft_timeline::ui::keyframes::KeyframeLane"
status = "same"
note = "A leaf: `new(label, keys, &Selection)` with `playhead` and `bounds`; the `view` and `rate` arguments are the `TimeAxis` of the enclosing `TimelineView`. The key drag comes back as an `EditEvent<Tick>` (the delta) in the output, not as a value; the selection comes back as `SelectionChange`s."

[[type]]
name = "KeyframeLaneResponse"
old = "craft_timeline::ui::keyframes::KeyframeLaneResponse"
new = ""
status = "removed"
note = "Renamed `KeyframeLaneOutput`."

[[type]]
name = "KeyframeLaneOutput"
old = ""
new = "craft_timeline::ui::keyframes::KeyframeLaneOutput"
status = "replaced"
note = "`KeyframeLaneOutput { response, delta: Option<EditEvent<Tick>>, select, double_clicked, context, delete }`; the value is `NoValue`."

[[type]]
name = "KeyframeNavigator"
old = "craft_timeline::ui::keyframes::KeyframeNavigator"
new = "craft_timeline::ui::keyframes::KeyframeNavigator"
status = "same"
note = "A pattern of three `IconButton`s: `new(label, has_previous, has_next, at_key)`."

[[type]]
name = "KeyframeNavigatorOutput"
old = "craft_timeline::ui::keyframes::KeyframeNavigatorOutput"
new = "craft_timeline::ui::keyframes::KeyframeNavigatorOutput"
status = "same"
note = "Adds the navigator's `response`."

[[type]]
name = "AnimationToggle"
old = "craft_timeline::ui::keyframes::AnimationToggle"
new = "craft_timeline::ui::keyframes::AnimationToggle"
status = "same"
note = "A pattern over `ToggleButton`: `new(Bind<bool>)` with `label`; `show` returns `EditResponse<bool>`."

[[type]]
name = "KeyframeId"
old = "craft_timeline::ui::keyframes::KeyframeId"
new = "craft_timeline::ui::keyframes::KeyframeId"
status = "same"

[[type]]
name = "KeyframeInterpolation"
old = "craft_timeline::ui::keyframes::KeyframeInterpolation"
new = "craft_timeline::ui::keyframes::KeyframeInterpolation"
status = "same"
note = "`#[non_exhaustive]`."

[[type]]
name = "KeyframeMark"
old = "craft_timeline::ui::keyframes::KeyframeMark"
new = "craft_timeline::ui::keyframes::KeyframeMark"
status = "same"
note = "`#[non_exhaustive]`; built with `KeyframeMark::new`."

[[type]]
name = "paint_keyframe"
old = "craft_timeline::ui::keyframes::paint_keyframe"
new = ""
status = "removed"
note = "`keyframe_icon` and the part's face."

[[type]]
name = "KeyframeLabels"
old = "craft_timeline::ui::keyframes::KeyframeLabels"
