note = "`KeyframeWords`, a words struct."

[[type]]
name = "MarkerStrip"
old = "craft_timeline::ui::markers::MarkerStrip"
new = "craft_timeline::ui::markers::MarkerStrip"
status = "same"
note = "A leaf: `new(label, markers)` with `snap` and `bin`; the `view` argument is the `TimeAxis`, `palette` and `labels` are gone. The drag comes back as an `EditEvent<MarkerSpan>` in the output, not as a value."

[[type]]
name = "MarkerStripResponse"
old = "craft_timeline::ui::markers::MarkerStripResponse"
new = ""
status = "removed"
note = "Renamed `MarkerStripOutput`."

[[type]]
name = "MarkerStripOutput"
old = ""
new = "craft_timeline::ui::markers::MarkerStripOutput"
status = "replaced"
note = "`MarkerStripOutput { response, span: Option<EditEvent<MarkerSpan>>, edits, context }`; the value is `NoValue`."

[[type]]
name = "MarkerEdit"
old = "craft_timeline::ui::markers::MarkerEdit"
new = "craft_timeline::ui::markers::MarkerEdit"
status = "same"
note = "`Move` and `SetDuration` are the strip's `MarkerSpan` gesture; `Delete`, `Open` and `Add` stay."

[[type]]
