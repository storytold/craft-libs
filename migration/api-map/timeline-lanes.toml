new = "craft_timeline::ui::markers::MarkerDialog"
status = "same"
note = "`MarkerDialog::new(&marker, format)`; `palette` and `labels` are gone: the label colours come from `LabelPalette` and their names from `TimelineWords`."

[[type]]
