old = "craft_timeline::ui::RenderQueueEvent"
new = "craft_timeline::ui::RenderQueueEvent"
status = "same"

[[type]]
name = "RenderItemId"
old = "craft_timeline::ui::RenderItemId"
new = "craft_timeline::ui::RenderItemId"
status = "same"

[[type]]
name = "RenderStatus"
old = "craft_timeline::ui::RenderStatus"
new = "craft_timeline::ui::RenderStatus"
status = "same"

# One entry per renamed, removed or reshaped setter or constructor.

[[setter]]
type = "TimecodeField"
old = "new(id_salt, time: Tick, &TimeFormat)"
new = "new(label, Bind<Tick>, TimeFormat)"

[[setter]]
type = "TimecodeField"
old = "show(ui) and show_full(ui)"
new = "show(ui)"
note = "One entry point returning `TimecodeFieldOutput`."

[[setter]]
type = "TimecodeField"
old = "width(f32)"
new = ""
note = "Removed: the width comes from `Codec::sample`."

[[setter]]
type = "TimecodeField"
old = "typing(text)"
new = ""
note = "Removed: the preset typing state is gone."

[[setter]]
type = "TimecodeField"
old = "large(bool)"
new = ""
note = "Not built: the text part has no type role or ink yet (see the track report)."

[[setter]]
type = "TimecodeField"
old = "labels(..) and display_labels(..)"
new = ""
note = "Removed: words come from the scope."

[[setter]]
type = "TimecodePanel"
old = "new(id_salt, &mut settings, &text)"
new = "new(label, Bind<TimecodePanelSettings>, TimecodeText)"

[[setter]]
type = "TransportBar"
old = "new(id_salt, &buttons)"
new = "new(label, &buttons)"

[[setter]]
type = "TransportBar"
old = "settings(&mut TransportBarSettings)"
new = "settings(Bind<TransportBarSettings>)"

[[setter]]
type = "MediaControls"
old = "new(id_salt, position, duration)"
new = "new(label, position, duration)"

[[setter]]
type = "FramePreview"
old = "new(id_salt, frame)"
new = "new(label, frame)"

[[setter]]
type = "FramePreview"
old = "status(&str)"
new = "status(impl Into<Label>)"

[[setter]]
type = "RenderQueueList"
old = "new(id_salt, &items, &mut selection, running)"
new = "new(label, &items, Bind<Selection<RenderItemId>>).running(bool)"


[[type]]
name = "FrameRate"
old = "craft_timeline::FrameRate"
new = "craft_timeline::FrameRate"
status = "replaced"
note = "`#[non_exhaustive]`: build one with `FrameRate::new(num, den)` (a `const fn`, reduced by the gcd) instead of a struct literal; `num` and `den` stay readable."

[[type]]
name = "SampleRate"
old = "craft_timeline::SampleRate"
new = "craft_timeline::SampleRate"
status = "replaced"
note = "The field is private: build one with `SampleRate::new(hz)` (a `const fn`) and read it with `hz()`."

[[type]]
name = "PixelAspect"
old = "craft_timeline::PixelAspect"
new = "craft_timeline::PixelAspect"
status = "replaced"
note = "`#[non_exhaustive]`: build one with `PixelAspect::new(num, den)` (a `const fn`) instead of a struct literal; `num` and `den` stay readable."
