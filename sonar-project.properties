sonar.projectKey=storytold_craft-libs
sonar.organization=storytold

# Browser fault-injection fixtures belong to the test analysis scope. Sources and tests both start
# at the root, as in lightcraft: sonar.tests alone stops the scanner defaulting sources to the
# repository, which left every analysis with only these 3 test files indexed.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=crates/platform/tests/**
